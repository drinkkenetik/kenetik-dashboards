        // ── Renders the sample-size bar + per-metric delta bars ──
        function renderPerformanceSection(exp, surfaceCfg) {
            const m = exp.current_metrics;
            if (!m || ((m.control?.sessions || 0) === 0 && (m.variant?.sessions || 0) === 0)) {
                return `<div class="awaiting">Awaiting first GA4 snapshot. Cron pulls metrics every 6h once events flow. Visualizations will appear here automatically.</div>`;
            }

            const cs = m.control?.sessions || 0;
            const vs = m.variant?.sessions || 0;
            const total = cs + vs;
            const cPct = total ? (cs / total * 100) : 50;
            const vPct = 100 - cPct;

            const sampleHtml = `
                <div class="sample-bar" title="control ${cs} · variant ${vs}">
                    <div class="control" style="width: ${cPct}%" title="Control: ${cs} sessions (${cPct.toFixed(1)}%)"></div>
                    <div class="variant" style="width: ${vPct}%" title="Variant: ${vs} sessions (${vPct.toFixed(1)}%)"></div>
                </div>
                <div class="sample-legend">
                    <span class="ctl">● Control: ${cs.toLocaleString()}<span class="pct">(${cPct.toFixed(1)}%)</span></span>
                    <span class="var">● Variant: ${vs.toLocaleString()}<span class="pct">(${vPct.toFixed(1)}%)</span></span>
                </div>`;

            // Per-metric delta bars (atc_rate, cvr, bounce_rate)
            const tier1Rules = surfaceCfg?.guardrails?.tier_1 || [];
            const tier2Rules = surfaceCfg?.guardrails?.tier_2 || [];
            const allMetricNames = new Set([
                ...tier1Rules.map(r => r.metric),
                ...tier2Rules.map(r => r.metric),
                'atc_rate', 'bounce_rate', 'cvr',
            ]);

            const metricRows = Array.from(allMetricNames).map(metric => {
                return renderMetricDeltaBar(metric, m, tier1Rules, tier2Rules);
            }).join('');

            return `
                <div style="margin-bottom: 14px;">
                    <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px;">Sample Size</div>
                    ${sampleHtml}
                </div>
                <div>
                    <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px;">Variant vs Control Delta (per metric)</div>
                    ${metricRows}
                </div>`;
        }

        // ── A single metric delta bar with threshold markers ──
        function renderMetricDeltaBar(metric, currentMetrics, tier1Rules, tier2Rules) {
            const ctrl = currentMetrics?.control?.[metric];
            const variant = currentMetrics?.variant?.[metric];

            const t1 = tier1Rules.find(r => r.metric === metric);
            const t2 = tier2Rules.find(r => r.metric === metric);

            // Bar visualizes -25% to +25% (5% padding beyond largest tier-1 threshold of 20%)
            const RANGE = 25;
            const pctToLeft = pct => 50 + (pct / RANGE) * 50;  // -25% = 0%, 0% = 50%, +25% = 100%

            // Threshold markers
            const markers = [];
            if (t1) {
                const dropMark = t1.direction === 'drop' ? -t1.threshold_pct : null;
                const riseMark = t1.direction === 'rise' ? t1.threshold_pct : null;
                if (dropMark !== null) markers.push({ pct: dropMark, cls: 'danger' });
                if (riseMark !== null) markers.push({ pct: riseMark, cls: 'danger' });
            }
            if (t2) {
                const dropMark = t2.direction === 'drop' ? -t2.threshold_pct : null;
                const riseMark = t2.direction === 'rise' ? t2.threshold_pct : null;
                if (dropMark !== null) markers.push({ pct: dropMark, cls: 'warning' });
                if (riseMark !== null) markers.push({ pct: riseMark, cls: 'warning' });
            }
            const markerHtml = markers.map(mk => {
                const left = Math.max(0, Math.min(100, pctToLeft(mk.pct)));
                return `<div class="threshold ${mk.cls}" style="left: ${left}%" title="${mk.pct}% threshold"></div>`;
            }).join('');

            // Fill bar (variant delta vs control)
            let fillHtml = '';
            let deltaText = '—';
            let deltaCls = 'muted';
            if (ctrl !== null && ctrl !== undefined && ctrl !== 0 && variant !== null && variant !== undefined) {
                const delta = (variant - ctrl) / ctrl;
                const deltaPct = delta * 100;
                const fillCls = breachClass(deltaPct, t1, t2);
                const isNeg = deltaPct < 0;
                const left = isNeg ? pctToLeft(deltaPct) : 50;
                const width = Math.abs(deltaPct) / RANGE * 50;
                fillHtml = `<div class="fill ${fillCls}" style="left: ${Math.max(0, Math.min(100, left))}%; width: ${Math.min(50, width)}%"></div>`;
                deltaText = `${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(1)}%`;
                deltaCls = (deltaPct > 0 && fillCls === 'healthy') ? 'pos'
                          : (deltaPct < 0 && fillCls === 'healthy') ? 'neg'
                          : '';
            } else if ((currentMetrics?.control?.sessions || 0) > 0) {
                deltaText = 'no data';
                deltaCls = 'muted';
            }

            // Format current values for display next to the bar
            const fmtVal = v => {
                if (v === null || v === undefined) return '—';
                if (metric.endsWith('_rate') || metric === 'cvr' || metric === 'bounce_rate') {
                    return (v * 100).toFixed(2) + '%';
                }
                return Number(v).toLocaleString();
            };
            const valuesHtml = `
                <div class="metric-values">
                    <div><span class="ctl-val">ctl</span> ${fmtVal(ctrl)}</div>
                    <div><span class="var-val">var</span> ${fmtVal(variant)}</div>
                </div>`;

            // Scale labels — absolute positioned to align exactly under each
            // tick mark on the bar above. Only renders labels for thresholds
            // that actually exist on this metric (e.g., bounce_rate only has
            // rise thresholds; cvr only has tier-1, no tier-2). Always
            // includes the zero label.
            const scaleLabels = [];
            scaleLabels.push({ pct: 0, text: '0', cls: 'zero' });
            if (t1) {
                if (t1.direction === 'drop') scaleLabels.push({ pct: -t1.threshold_pct, text: '−' + t1.threshold_pct + '%', cls: 'danger' });
                if (t1.direction === 'rise') scaleLabels.push({ pct: +t1.threshold_pct, text: '+' + t1.threshold_pct + '%', cls: 'danger' });
            }
            if (t2) {
                if (t2.direction === 'drop') scaleLabels.push({ pct: -t2.threshold_pct, text: '−' + t2.threshold_pct + '%', cls: 'warning' });
                if (t2.direction === 'rise') scaleLabels.push({ pct: +t2.threshold_pct, text: '+' + t2.threshold_pct + '%', cls: 'warning' });
            }
            const scaleHtml = `
                <div class="metric-scale">
                    ${scaleLabels.map(l => {
                        const left = Math.max(0, Math.min(100, pctToLeft(l.pct)));
                        return `<span class="tick-label ${l.cls}" style="left: ${left}%">${l.text}</span>`;
                    }).join('')}
                </div>`;

            return `
                <div class="metric-row">
                    <div class="metric-label">${metric}</div>
                    ${valuesHtml}
                    <div class="metric-bar-wrap">
                        <div class="metric-bar${ctrl === undefined ? ' empty' : ''}">
                            <div class="zero"></div>
                            ${markerHtml}
                            ${fillHtml}
                        </div>
                        ${scaleHtml}
                    </div>
                    <div class="metric-delta ${deltaCls}">${deltaText}</div>
                </div>`;
        }

        function breachClass(deltaPct, t1, t2) {
            // Determine which tier (if any) this delta breaches.
            function breaches(rule, dpct) {
                if (!rule) return false;
                const t = rule.threshold_pct;
                return rule.direction === 'drop' ? dpct <= -t : dpct >= +t;
            }
            if (breaches(t1, deltaPct)) return 'tier1';
            if (breaches(t2, deltaPct)) return 'tier2';
            return 'healthy';
        }

        // ── Phase timeline (horizontal pills with current highlighted) ──
        function renderPhaseTimeline(exp) {
            const phases = ['idle', 'awaiting_approval', 'canary', 'measuring', 'analyzing', 'decided'];
            const current = exp.phase || 'idle';
            const reachedSet = new Set((exp.phase_history || []).map(p => p.phase));
            reachedSet.add(current);

            const pills = phases.map(p => {
                const cls = (p === current) ? 'current' : (reachedSet.has(p) ? 'done' : '');
                return `<div class="phase-pill-tl ${cls}">${p.replace('_', ' ')}</div>`;
            }).join('');

            // Estimate time-in-current-phase (already computed elsewhere; quick summary here)
            const lastEntry = (exp.phase_history || []).filter(p => p.phase === current).pop();
            const enteredAt = lastEntry?.entered_at;
            const meta = enteredAt ? `In <strong>${current}</strong> since ${fmtTimeAbs(enteredAt)} · ${fmtRelative(enteredAt)}` : '';

            return `
                <div class="phase-timeline">${pills}</div>
                <div class="phase-timeline-meta">${meta}</div>`;
        }

        // ── Guardrail status visual: pills showing which tier each metric is in ──
        function renderGuardrailVisual(metrics, surfaceCfg) {
            const safetyEnabled = appState.stateJson?._safety_config?.revert_enabled;
            const stage = safetyEnabled ? 'Stage 2 — auto-revert LIVE' : 'Stage 1 — alert-only';

            if (!surfaceCfg?.guardrails) {
                return '<div class="awaiting">Surface config not yet synced.</div>';
            }
            const t1 = surfaceCfg.guardrails.tier_1 || [];
            const t2 = surfaceCfg.guardrails.tier_2 || [];

            const summary = `<p style="margin-bottom: 10px; color: var(--text-muted); font-size: 11px;">
                <strong style="color: var(--text)">${stage}</strong> · min canary sessions per arm: ${surfaceCfg.guardrails.min_canary_sessions_per_arm || 50}
            </p>`;

            const tierRow = (label, rules, color) => `
                <div style="margin-bottom: 6px;">
                    <span style="font-size: 11px; color: ${color}; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;">${label}:</span>
                    ${rules.length ? rules.map(r =>
                        `<span style="display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 3px; background: var(--bg); font-size: 11px; font-family: monospace;">${r.metric} ${r.direction === 'drop' ? '−' : '+'}${r.threshold_pct}%</span>`
                    ).join('') : '<em style="color: var(--text-muted); font-size: 11px;">none</em>'}
                </div>`;

            return summary + tierRow('Tier 1 (auto-revert)', t1, 'var(--danger)') + tierRow('Tier 2 (pause)', t2, 'var(--warning)');
        }

        function toggleDetail(surface) {
            const row = document.getElementById('detail-' + surface);
            if (!row) return;
            const visible = row.style.display !== 'none';
            row.style.display = visible ? 'none' : 'table-row';
            const dataRow = document.querySelector(`tr[data-surface="${surface}"]`);
            if (dataRow) dataRow.classList.toggle('expanded', !visible);
        }

        function renderRecentlyDecided() {
            const exps = appState.stateJson?.experiments || {};
            // No completed cycles yet — show empty state for Phase 1
            const decided = Object.values(exps).filter(e => e.phase === 'decided' || e.phase === 'idle' && (e.phase_history || []).some(p => p.phase === 'decided'));
            if (!decided.length) {
                return `
                    <div class="panel compact-empty">
                        <div class="panel-header">
                            <div class="panel-title">Recently Decided</div>
                            <div class="panel-meta">No completed cycles yet · first ETA ~May 4</div>
                        </div>
                    </div>`;
            }
            // (Detailed table will populate once Cycle 1 completes; minimal scaffold for now)
            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Recently Decided</div>
                        <div class="panel-meta">${decided.length} cycle${decided.length === 1 ? '' : 's'} · last 30 days</div>
                    </div>
                    <div class="panel-body padded">
                        <p style="font-size: 12px; color: var(--text-muted)">Detail rendering wired in once Cycle 1 ships an outcome. (Phase 1 scaffold.)</p>
                    </div>
                </div>`;
        }

        // ── Markdown parsing helpers for Performance Memory ──
        function parsePmMarkdown(md) {
            // Returns { preamble, sections: { 'Section Name': 'raw md content' } }
            // Splits on `## Heading` markers.
            const sections = {};
            const parts = md.split(/^##\s+/m);
            const preamble = (parts[0] || '').trim();
            for (let i = 1; i < parts.length; i++) {
                const lines = parts[i].split('\n');
                const heading = lines[0].trim();
                const content = lines.slice(1).join('\n').trim();
                sections[heading] = content;
            }
            return { preamble, sections };
        }

        function parseSurfaceInfo(infoMd) {
            // Extract bullet-list metadata from the Surface Info section.
            // Format: "- **Key**: value"
            const out = {};
            const re = /^\s*-\s*\*\*([^:]+?)\*\*:\s*(.+?)\s*$/gm;
            let m;
            while ((m = re.exec(infoMd)) !== null) {
                out[m[1].trim()] = m[2].trim();
            }
            return out;
        }

        function parsePatternEntries(sectionMd) {
            // Parse cycle entries in format:
            //   - [Cycle N] description (lift: +X.X%, p: 0.XXX, date: YYYY-MM-DD)
            // Returns array of {cycle, description, lift, date, raw}
            if (!sectionMd) return [];
            const entries = [];
            const re = /^\s*-\s+\[Cycle\s+(\d+)\]\s+(.+?)$/gm;
            let m;
            while ((m = re.exec(sectionMd)) !== null) {
                const raw = m[2];
                const liftMatch = raw.match(/lift:\s*([+\-]?\d+\.?\d*)\s*%/i);
                const dateMatch = raw.match(/date:\s*(\d{4}-\d{2}-\d{2})/i);
                const desc = raw.replace(/\s*\(.*\)\s*$/, '').trim();
                entries.push({
                    cycle: parseInt(m[1]),
                    description: desc,
                    lift: liftMatch ? parseFloat(liftMatch[1]) : null,
                    date: dateMatch ? dateMatch[1] : null,
                    raw,
                });
            }
            return entries;
        }

        function parseQuestionList(sectionMd) {
            if (!sectionMd) return [];
            // Strip placeholder "_(No patterns recorded yet...)_" lines
            return sectionMd
                .split('\n')
                .map(l => l.trim())
                .filter(l => l.startsWith('-'))
                .map(l => l.replace(/^-\s+/, ''));
        }

        function isEmptyPlaceholder(sectionMd) {
            if (!sectionMd) return true;
            return /^_\(No\s/i.test(sectionMd.trim());
        }

        // ── Render performance memory for a single surface ──
        function renderPmSurface(surface, md) {
            const { preamble, sections } = parsePmMarkdown(md);
            const info = parseSurfaceInfo(sections['Surface Info'] || '');
            const wins = parsePatternEntries(sections['Winning Patterns'] || '');
            const losses = parsePatternEntries(sections['Losing Patterns'] || '');
            const reverts = parsePatternEntries(sections['Emergency Reverts'] || '');
            const questions = parseQuestionList(sections['Open Questions'] || '');

            const totalCycles = wins.length + losses.length + reverts.length;
            const totalKeeps = wins.length;
            const totalDiscards = losses.length;
            const winRate = totalCycles > 0 ? Math.round((totalKeeps / totalCycles) * 100) : null;

            // Cumulative lift from md, or compute from wins
            const liftFromMd = info['Cumulative lift'] || '0.0%';
            const cumulativeLift = parseFloat(liftFromMd) || 0;

            // ── Stats strip ──
            const statsStrip = `
                <div class="pm-stats-strip">
                    <div class="pm-stat">
                        <span class="pm-stat-label">Total Cycles</span>
                        <span class="pm-stat-value">${totalCycles}</span>
                        <span class="pm-stat-meta">${totalKeeps} keep · ${totalDiscards} discard${reverts.length ? ' · ' + reverts.length + ' revert' : ''}</span>
                    </div>
                    <div class="pm-stat">
                        <span class="pm-stat-label">Cumulative Lift</span>
                        <span class="pm-stat-value ${cumulativeLift > 0 ? 'gradient' : (cumulativeLift === 0 ? 'muted' : '')}">${cumulativeLift > 0 ? '+' : ''}${cumulativeLift.toFixed(1)}%</span>
                        <span class="pm-stat-meta">across ${totalCycles} cycle${totalCycles === 1 ? '' : 's'}</span>
                    </div>
                    <div class="pm-stat">
                        <span class="pm-stat-label">Win Rate</span>
                        <span class="pm-stat-value ${winRate === null ? 'muted' : ''}">${winRate === null ? '—' : winRate + '%'}</span>
                        ${renderWinRateDots(wins, losses, reverts)}
                    </div>
                    <div class="pm-stat">
                        <span class="pm-stat-label">Open Questions</span>
                        <span class="pm-stat-value">${questions.length}</span>
                        <span class="pm-stat-meta">untested hypotheses queued</span>
                    </div>
                </div>`;

            // ── Decided Cycles (combined wins + losses, newest first) ──
            const allDecided = [...wins.map(w => ({...w, outcome: 'keep'})),
                                ...losses.map(l => ({...l, outcome: 'discard'}))]
                                .sort((a, b) => b.cycle - a.cycle);

            const decidedHtml = allDecided.length ? `
                ${allDecided.map(c => `
                    <div class="cycle-row">
                        <div class="cycle-dot ${c.outcome}"></div>
                        <div class="cycle-meta">
                            <span class="cycle-tag">cycle ${c.cycle}</span>
                            <span class="cycle-desc">${c.description}</span>
                        </div>
                        <div class="cycle-lift ${c.lift > 0 ? 'pos' : (c.lift < 0 ? 'neg' : 'flat')}">${c.lift !== null ? (c.lift >= 0 ? '+' : '') + c.lift.toFixed(1) + '%' : '—'}</div>
                        <div class="cycle-date">${c.date || ''}</div>
                    </div>`).join('')}
            ` : `<div class="pm-empty">No cycles decided yet. First cycle expected to decide ~May 4. Each row will show outcome (keep/discard), pattern, lift, and date.</div>`;

            // ── Patterns Learned (alias for the cycle list above; could become tag aggregation later) ──
            // For now, omit if the cycle ledger above is the same data.

            // ── Emergency Reverts (only render if non-empty) ──
            const revertsHtml = reverts.length ? `
                <div class="pm-section-block danger">
                    <h3>Emergency Reverts <span class="badge" style="background: rgba(239,68,68,0.15); color: var(--danger)">${reverts.length}</span></h3>
                    ${reverts.map(r => `
                        <div class="cycle-row">
                            <div class="cycle-dot reverted"></div>
                            <div class="cycle-meta">
                                <span class="cycle-tag">cycle ${r.cycle}</span>
                                <span class="cycle-desc">${r.description}</span>
                            </div>
                            <div class="cycle-lift">—</div>
                            <div class="cycle-date">${r.date || ''}</div>
                        </div>`).join('')}
                </div>` : '';

            // ── Open Questions (right column) ──
            const questionsHtml = questions.length ? `
                <ul class="pm-question-list">
                    ${questions.map(q => `<li>${q}</li>`).join('')}
                </ul>
            ` : `<div class="pm-empty">No untested hypotheses queued.</div>`;

            // ── Cross-Surface Insights (right column) ──
            const crossInsightsRaw = sections['Cross-Surface Insights'] || '';
            const crossHtml = isEmptyPlaceholder(crossInsightsRaw) ?
                `<div class="pm-empty">No cross-surface insights yet. Patterns generalizable to other surfaces will appear here once cycle 1 decides.</div>`
                : `<div class="pm-prose">${marked.parse(crossInsightsRaw)}</div>`;

            // ── Preamble (above 2-col grid, brief context) ──
            const preambleHtml = preamble ? `<div class="pm-prose" style="padding: 14px 24px 0;">${marked.parse(preamble)}</div>` : '';

            // ── Compose ──
            return `
                <div class="pm-content">
                    ${statsStrip}
                    ${preambleHtml}
                    <div class="pm-grid">
                        <div>
                            <div class="pm-section-block">
                                <h3>Decided Cycles
                                    ${allDecided.length ? `<span class="badge accent">${allDecided.length}</span>` : ''}
                                </h3>
                                ${decidedHtml}
                            </div>
                            ${revertsHtml}
                        </div>
                        <div>
                            <div class="pm-section-block">
                                <h3>Open Questions
                                    ${questions.length ? `<span class="badge">${questions.length}</span>` : ''}
                                </h3>
                                ${questionsHtml}
                            </div>
                            <div class="pm-section-block">
                                <h3>Cross-Surface Insights</h3>
                                ${crossHtml}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderWinRateDots(wins, losses, reverts) {
            // Last 8 outcomes, oldest → newest
            const all = [...wins.map(w => ({c: w.cycle, k: 'keep'})),
                         ...losses.map(l => ({c: l.cycle, k: 'discard'})),
                         ...reverts.map(r => ({c: r.cycle, k: 'reverted'}))]
                         .sort((a, b) => a.c - b.c)
                         .slice(-8);
            if (!all.length) {
                return `<div class="pm-winrate-dots">${'<div class="pm-winrate-dot"></div>'.repeat(8)}</div>`;
            }
            const dots = all.map(o => `<div class="pm-winrate-dot ${o.k}"></div>`).join('');
            // Pad with empty dots if <8
            const empties = '<div class="pm-winrate-dot"></div>'.repeat(Math.max(0, 8 - all.length));
            return `<div class="pm-winrate-dots">${empties}${dots}</div>`;
        }

        function renderPerformanceMemory() {
            const sections = SURFACES_LIST.map(surface => {
                const md = appState.performance[surface];
                if (!md) {
                    return `
                        <div class="pm-section" data-surface="${surface}">
                            <div class="pm-toggle" onclick="this.parentElement.classList.toggle('open')">
                                <span class="arrow">▶</span>
                                <span class="pm-toggle-text">${surface}</span>
                                <span class="pm-meta">no memory file</span>
                            </div>
                            <div class="pm-content" style="display: block;"><div class="pm-inner"><em style="color: var(--text-muted)">Performance memory not yet synced for this surface.</em></div></div>
                        </div>`;
                }
                const info = parseSurfaceInfo(parsePmMarkdown(md).sections['Surface Info'] || '');
                const cycles = info['Total cycles'] || '0';
                const lift = info['Cumulative lift'] || '0.0%';
                return `
                    <div class="pm-section" data-surface="${surface}">
                        <div class="pm-toggle" onclick="this.parentElement.classList.toggle('open')">
                            <span class="arrow">▶</span>
                            <span class="pm-toggle-text">${surface}</span>
                            <span class="pm-meta">${cycles} cycle${cycles === '1' ? '' : 's'} · cumulative lift ${lift}</span>
                        </div>
                        ${renderPmSurface(surface, md)}
                    </div>`;
            }).join('');
            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Performance Memory</div>
                        <div class="panel-meta">institutional learnings · click surface to expand</div>
                    </div>
                    <div class="panel-body">${sections}</div>
                </div>`;
        }

        // ─── CLARITY PANELS (C1) ───────────────────────────────────────────────
        // Reads appState.clarity (most recent snapshot) and renders two
        // side-by-side panels: top friction URLs + top engagement URLs.
        // Empty state when no clarity data is available (cron hasn't run
        // yet, or rubric is missing). Honors low_confidence flag to keep
        // sub-50-session URLs out of leaderboards.

        function _shortenUrl(u) {
            if (!u) return '';
            try {
                const parsed = new URL(u);
                return (parsed.pathname || '/') + (parsed.search || '');
            } catch (e) {
                return u;
            }
        }

        function _topUrls(snap, scoreField, n = 5, ascending = false) {
            if (!snap || !snap.urls) return [];
            const entries = Object.entries(snap.urls)
                .filter(([u, rec]) => !rec.low_confidence && rec.sessions > 0)
                .map(([u, rec]) => ({ url: u, ...rec }));
            entries.sort((a, b) => (ascending ? 1 : -1) * (b[scoreField] - a[scoreField]));
            return entries.slice(0, n);
        }

        function _topFrictionSignal(rec) {
            // Find the friction signal with the highest per-1k rate; humanize the label.
            const signals = {
                'rage_clicks_per_1k_sessions':       'rage clicks',
                'dead_clicks_per_1k_sessions':       'dead clicks',
                'quickback_clicks_per_1k_sessions':  'quickbacks',
                'excessive_scroll_per_1k_sessions':  'excessive scroll',
                'error_clicks_per_1k_sessions':      'error clicks',
                'script_errors_per_1k_sessions':     'script errors',
            };
            let best = null;
            for (const [field, label] of Object.entries(signals)) {
                const v = rec[field] || 0;
                if (!best || v > best.value) best = { field, label, value: v };
            }
            return best;
        }

        function renderClarityPanels() {
            const snap = appState.clarity;
            if (!snap) {
                return `
                    <div class="panel compact-empty">
                        <div class="panel-header">
                            <div class="panel-title">Behavioral Telemetry (Clarity)</div>
                            <div class="panel-meta">No snapshot available — cron may not have run yet</div>
                        </div>
                    </div>`;
            }

            const fmtPct = v => (v == null ? '—' : v.toFixed(1));
            const fmtScore = v => (v == null ? '—' : v.toFixed(0));
            const friction = _topUrls(snap, 'friction_score', 5);
            const engagement = _topUrls(snap, 'engagement_score', 5);
            const meta = `${snap.snapshot_date} · ${snap.site_summary?.url_count || 0} URLs · ${snap.site_summary?.total_sessions_human || 0} human sessions`;

            const frictionRow = (e) => {
                const dom = _topFrictionSignal(e);
                const domHint = dom && dom.value > 0 ? `${dom.label} ${dom.value.toFixed(1)}/1k` : '—';
                return `
                    <div class="clarity-row">
                        <div class="clarity-url" title="${e.url}">${_shortenUrl(e.url)}</div>
                        <div class="clarity-score friction-score">friction ${fmtScore(e.friction_score)}</div>
                        <div class="clarity-meta">${e.sessions} sessions · ${domHint}</div>
                    </div>`;
            };

            const engagementRow = (e) => `
                <div class="clarity-row">
                    <div class="clarity-url" title="${e.url}">${_shortenUrl(e.url)}</div>
                    <div class="clarity-score engagement-score">engage ${fmtScore(e.engagement_score)}</div>
                    <div class="clarity-meta">${e.sessions} sessions · ${(e.engagement_time_sec || 0).toFixed(0)}s active · ${fmtPct(e.scroll_depth_pct)}% scroll</div>
                </div>`;

            const errors = (snap.api_errors || []).length;
            const errorBanner = errors
                ? `<div class="panel-warning">${errors} of 3 Clarity API call(s) failed for this snapshot — leaderboards reflect partial data</div>`
                : '';

            return `
                <div class="clarity-grid">
                    <div class="panel">
                        <div class="panel-header">
                            <div class="panel-title">Site Friction Leaderboard</div>
                            <div class="panel-meta">${meta}</div>
                        </div>
                        ${errorBanner}
                        <div class="panel-body">
                            ${friction.length === 0
                                ? '<div class="panel-empty">No URLs with sufficient sessions yet.</div>'
                                : friction.map(frictionRow).join('')}
                        </div>
                    </div>
                    <div class="panel">
                        <div class="panel-header">
                            <div class="panel-title">Engagement Leaders</div>
                            <div class="panel-meta">${meta}</div>
                        </div>
                        ${errorBanner}
                        <div class="panel-body">
                            ${engagement.length === 0
                                ? '<div class="panel-empty">No URLs with sufficient sessions yet.</div>'
                                : engagement.map(engagementRow).join('')}
                        </div>
                    </div>
                </div>`;
        }

        // ─── PER-EXPERIMENT CLARITY (Panel C — C4.2) ───────────────────────────
        // Renders a surface-scoped Clarity friction snapshot inline within an
        // experiment's detail card. Reads:
        //   • surfaceCfg.urls (from auto-optimize/surfaces/<surface>.yaml)
        //   • appState.clarity.urls (today's snapshot, keyed by canonical URL)
        //
        // Per-arm caveat: Clarity does not segment by ao_variant cookie, so
        // friction shown here aggregates traffic across BOTH control and
        // variant. It's a directional surface-health signal, not an
        // experiment-arm diff. The caveat is rendered explicitly so no one
        // mistakes this for per-variant attribution.
        function renderExperimentClarity(surface, exp, surfaceCfg) {
            const surfaceUrls = (surfaceCfg && Array.isArray(surfaceCfg.urls)) ? surfaceCfg.urls : [];
            if (!surfaceUrls.length) {
                return `<div class="clarity-inline-empty">Surface YAML has no <code>urls</code> field — Clarity context unavailable.</div>`;
            }

            const snap = appState.clarity;
            if (!snap || !snap.urls) {
                return `<div class="clarity-inline-empty">No Clarity snapshot loaded yet.</div>`;
            }

            // Filter snapshot to just this surface's URLs (case-sensitive
            // exact match — both sides canonicalize to scheme+host+path
            // upstream so this is safe).
            const surfaceSet = new Set(surfaceUrls);
            const matched = Object.entries(snap.urls)
                .filter(([u, rec]) => surfaceSet.has(u))
                .map(([u, rec]) => ({ url: u, ...rec }));

            if (!matched.length) {
                return `
                    <div class="clarity-inline-empty">
                        No Clarity friction data for this surface's ${surfaceUrls.length} URL${surfaceUrls.length === 1 ? '' : 's'} in the latest snapshot
                        (${snap.snapshot_date}). May indicate the API call hit a quota or these URLs got &lt;50 sessions in the lookback window.
                    </div>`;
            }

            // Sort by friction_score desc, render top 3. Even if the surface
            // has more URLs (typical PDP has 3-5), top 3 is the actionable cut.
            matched.sort((a, b) => (b.friction_score || 0) - (a.friction_score || 0));
            const topN = matched.slice(0, 3);

            const fmtScore = v => (v == null ? '—' : v.toFixed(0));
            const rows = topN.map(e => {
                const dom = _topFrictionSignal(e);
                const domHint = dom && dom.value > 0 ? `${dom.label} ${dom.value.toFixed(1)}/1k` : '—';
                const lowConf = e.low_confidence ? ' · <span style="color: var(--warning)">low confidence (&lt;50 sessions)</span>' : '';
                return `
                    <div class="clarity-row">
                        <div class="clarity-url" title="${e.url}">${_shortenUrl(e.url)}</div>
                        <div class="clarity-score friction-score">friction ${fmtScore(e.friction_score)}</div>
                        <div class="clarity-meta">
                            ${e.sessions} sessions · ${domHint} · engage ${fmtScore(e.engagement_score)}${lowConf}
                        </div>
                    </div>`;
            }).join('');

            return `
                ${rows}
                <div class="clarity-caveat">
                    Aggregates control + variant traffic — Clarity doesn't segment by <code>ao_variant</code> cookie.
                    Use this as surface-health context; pull session replays in Clarity UI to confirm whether the
                    variant is driving any spike. Snapshot: ${snap.snapshot_date}.
                </div>`;
        }

        // ─── ANOMALY PANEL (Panel D — C5.2) ────────────────────────────────────
        // Reads appState.clarity.anomalies[] (computed by the cron's
        // detect_clarity_anomalies(), see scripts/track_clarity_cron.py).
        // Shows URLs whose health_score dropped or friction_score rose
        // meaningfully week-over-week.
        //
        // Three-state rendering:
        //   • field missing entirely (older snapshot, pre-C5)  → "Building baseline" empty state
        //   • field present but empty (no movers OR no N-7)    → "Stable" message
        //   • field has entries                                → row-per-anomaly
        //
        // Activates from day 8 of snapshot history. Before that the cron
        // can't find an N-7 baseline and writes anomalies: [].
        function renderAnomalyPanel() {
            const snap = appState.clarity;
            if (!snap) {
                return '';   // No clarity at all — Panel A/B already shows that empty state
            }

            const anomalies = snap.anomalies;
            const meta = `${snap.snapshot_date} · week-over-week`;

            // Field absent (cron pre-C5 or rubric load failed): graceful "building baseline"
            if (anomalies === undefined) {
                return `
                    <div class="panel compact-empty">
                        <div class="panel-header">
                            <div class="panel-title">Week-over-Week Movers</div>
                            <div class="panel-meta">Building baseline — needs ~7 days of snapshot history</div>
                        </div>
                    </div>`;
            }

            // Field present but empty: no movers OR no N-7 found
            if (!Array.isArray(anomalies) || anomalies.length === 0) {
                return `
                    <div class="panel compact-empty">
                        <div class="panel-header">
                            <div class="panel-title">Week-over-Week Movers</div>
                            <div class="panel-meta">${meta} · no URLs crossed the worsening threshold</div>
                        </div>
                    </div>`;
            }

            const fmtScore = v => (v == null ? '—' : Number(v).toFixed(0));
            const fmtSignal = v => (v == null ? '—' : Number(v).toFixed(1));
            const fmtDelta = v => {
                if (v == null) return '—';
                const sign = v >= 0 ? '+' : '';
                return `${sign}${Number(v).toFixed(0)}`;
            };
            const triggerBadge = trig => {
                if (trig === 'health_drop') return '<span class="anomaly-badge health">health drop</span>';
                if (trig === 'friction_rise') return '<span class="anomaly-badge friction">friction rise</span>';
                if (trig === 'both') return '<span class="anomaly-badge both">both</span>';
                return '';
            };

            const rows = anomalies.map(a => `
                <div class="anomaly-row">
                    <div class="anomaly-header">
                        <div class="anomaly-url" title="${a.url}">${_shortenUrl(a.url)}</div>
                        ${triggerBadge(a.trigger)}
                    </div>
                    <div class="anomaly-grid">
                        <div class="anomaly-metric">
                            <span class="anomaly-label">Health</span>
                            <span class="anomaly-value">${fmtScore(a.health_score_prev)} → ${fmtScore(a.health_score_now)}</span>
                            <span class="anomaly-delta ${a.health_score_delta < 0 ? 'neg' : 'pos'}">${fmtDelta(a.health_score_delta)}</span>
                        </div>
                        <div class="anomaly-metric">
                            <span class="anomaly-label">Friction</span>
                            <span class="anomaly-value">${fmtScore(a.friction_score_prev)} → ${fmtScore(a.friction_score_now)}</span>
                            <span class="anomaly-delta ${a.friction_score_delta > 0 ? 'neg' : 'pos'}">${fmtDelta(a.friction_score_delta)}</span>
                        </div>
                        <div class="anomaly-metric">
                            <span class="anomaly-label">${a.dominant_signal_label || 'Top signal'}</span>
                            <span class="anomaly-value">${fmtSignal(a.dominant_signal_prev)} → ${fmtSignal(a.dominant_signal_now)}/1k</span>
                            <span class="anomaly-delta muted">vs ${a.comparison_date}</span>
                        </div>
                        <div class="anomaly-metric">
                            <span class="anomaly-label">Sessions</span>
                            <span class="anomaly-value">${(a.sessions_prev || 0).toLocaleString()} → ${(a.sessions_now || 0).toLocaleString()}</span>
                            <span class="anomaly-delta muted">volume ctx</span>
                        </div>
                    </div>
                </div>`).join('');

            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Week-over-Week Movers</div>
                        <div class="panel-meta">${meta} · ${anomalies.length} URL${anomalies.length === 1 ? '' : 's'} worsened</div>
                    </div>
                    <div class="panel-body">${rows}</div>
                </div>`;
        }

        function renderSystemHealth() {
            // Stats bar at top covers active surfaces / stage / last cron / cycles —
            // keep this footer slim, just for context the stats bar can't fit.
            return `
                <div class="footnote" style="margin-top: 18px;">
                    GA4 metric integration is Phase 2 — live A/B traffic data populates
                    once the cron's GA4 query catches up (24-48h for fresh dimensions).
                    Realtime view in GA4 admin shows events immediately if you need
                    instant signal during canary.
                </div>`;
        }

        function renderStatsBar() {
            const s = appState.stateJson;
            const exps = s?.experiments || {};
            const activeCount = Object.values(exps).filter(e => e.phase && e.phase !== 'idle').length;
            const totalSurfaces = SURFACES_LIST.length;
            const stage = s?._safety_config?.revert_enabled ? '2 — Live' : '1 — Alert-Only';
            const stageGradient = !s?._safety_config?.revert_enabled;

            // Find current canary/measuring experiment for "Cycle" card
            const activeExp = Object.values(exps).find(e => e.phase === 'canary' || e.phase === 'measuring');
            const currentCycle = activeExp ? (activeExp.cycle_tag || activeExp.experiment_id) : '—';
            const currentPhase = activeExp ? activeExp.phase : 'idle';

            return `
                <div class="stats-bar">
                    <div class="stat-card">
                        <span class="stat-card-label">Stage</span>
                        <span class="stat-card-value ${stageGradient ? 'gradient' : ''}">${stage}</span>
                        <span class="stat-card-meta">${stageGradient ? 'Calibrating thresholds' : 'Auto-revert active'}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Active Surfaces</span>
                        <span class="stat-card-value">${activeCount} / ${totalSurfaces}</span>
                        <span class="stat-card-meta">${activeCount === totalSurfaces ? 'all running' : (totalSurfaces - activeCount) + ' idle'}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Current Cycle</span>
                        <span class="stat-card-value" style="font-size: 14px; font-family: 'SF Mono', Menlo, Consolas, monospace;">${currentCycle}</span>
                        <span class="stat-card-meta">${activeExp ? activeExp.surface + ' · ' + currentPhase : 'no active experiment'}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Last Cron Run</span>
                        <span class="stat-card-value" style="font-size: 14px;"><span class="pulse-dot"></span>${fmtRelative(s?._last_cron_run)}</span>
                        <span class="stat-card-meta">${fmtTimeAbs(s?._last_cron_run)}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Cycles Decided</span>
                        <span class="stat-card-value">0</span>
                        <span class="stat-card-meta">first cycle in flight</span>
                    </div>
                </div>`;
        }

        function render() {
            renderError();
            const lastRefreshEl = document.getElementById('lastRefresh');
            if (appState.loadedAt) {
                lastRefreshEl.innerHTML = `<span class="pulse-dot"></span>loaded ${fmtRelative(appState.loadedAt.toISOString())}`;
            }

            if (!appState.stateJson) {
                document.getElementById('content').innerHTML = '<div class="panel-empty">No state.json loaded. Check the error banner above.</div>';
                return;
            }

            document.getElementById('content').innerHTML = `
                ${renderStatsBar()}
                ${renderActionQueue()}
                ${renderActiveExperiments()}
                ${renderClarityPanels()}
                ${renderAnomalyPanel()}
                ${renderRecentlyDecided()}
                ${renderPerformanceMemory()}
                ${renderSystemHealth()}
            `;
        }

        async function refresh() {
            const btn = document.getElementById('refreshBtn');
            btn.textContent = '↻ Loading…';
            btn.disabled = true;
            await loadAll();
            render();
            btn.textContent = '↻ Refresh';
            btn.disabled = false;
        }

        document.getElementById('refreshBtn').addEventListener('click', refresh);

        // Initial load + auto-refresh every 5 minutes
        refresh();
        setInterval(refresh, 5 * 60 * 1000);
    </script>
</body>
</html>
