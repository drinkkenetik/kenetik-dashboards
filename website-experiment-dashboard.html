<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenetik Website Experiment Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #22262f;
            --border: #2a2e3a;
            --text: #e4e4e7;
            --text-muted: #8b8fa3;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --kenetik-green: #22c55e;
            --gold: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Animations (subtle, used sparingly) ── */
        @keyframes pulse-fade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            50% { box-shadow: 0 0 0 4px rgba(34,197,94,0); }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse { animation: pulse-fade 2.4s ease-in-out infinite; }
        .pulse-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 5px;
            vertical-align: middle;
            animation: pulse-dot 2s ease-out infinite;
        }
        .pulse-dot.warn { background: var(--warning); animation-name: pulse-dot; box-shadow: 0 0 0 0 rgba(245,158,11,0.4); }
        .pulse-dot.muted { background: var(--text-muted); animation: none; }

        a { color: var(--accent-light); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .dashboard {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-left h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.6px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--info) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .subtitle {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── Stats bar (at-a-glance system status) ── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.15s, transform 0.15s;
        }
        .stat-card:hover {
            border-color: rgba(99,102,241,0.4);
            transform: translateY(-1px);
        }
        .stat-card-label {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
        }
        .stat-card-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .stat-card-value.gradient {
            background: linear-gradient(135deg, var(--gold) 0%, var(--info) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .refresh-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .last-refresh {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── Section panels ── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 14px;
            overflow: hidden;
            animation: fade-in-up 0.3s ease;
        }
        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .panel-meta {
            font-size: 11px;
            color: var(--text-muted);
        }
        .panel-body {
            padding: 0;
        }
        .panel-body.padded { padding: 14px 18px; }
        .panel-empty {
            padding: 14px 18px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        /* Inline empty states — for panels where the empty state is the
           normal steady state and shouldn't dominate the screen. */
        .panel.compact-empty .panel-empty {
            padding: 10px 18px;
            text-align: left;
            font-style: italic;
        }

        /* ── Action queue items ── */
        .action-row {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid var(--info);
        }
        .action-row:last-child { border-bottom: none; }
        .action-row.danger { border-left-color: var(--danger); background: rgba(239,68,68,0.04); }
        .action-row.warning { border-left-color: var(--warning); background: rgba(245,158,11,0.04); }
        .action-row.info { border-left-color: var(--info); }
        .action-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .action-text {
            flex: 1;
            font-size: 13px;
            text-align: left;
        }
        .action-text strong { color: var(--text); }
        .action-text .meta {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 2px;
        }
        .action-cta {
            font-size: 11px;
            color: var(--accent-light);
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            white-space: nowrap;
        }
        .action-cta:hover { border-color: var(--accent); text-decoration: none; }

        /* ── Clarity behavioral telemetry panels (C1) ── */
        .clarity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }
        @media (max-width: 900px) {
            .clarity-grid { grid-template-columns: 1fr; }
        }
        .clarity-row {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto;
            gap: 4px 12px;
            align-items: baseline;
            text-align: left;
        }
        .clarity-row:last-child { border-bottom: none; }
        .clarity-url {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            grid-column: 1;
            grid-row: 1;
        }
        .clarity-score {
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            grid-column: 2;
            grid-row: 1;
            white-space: nowrap;
        }
        .clarity-score.friction-score { color: var(--danger); }
        .clarity-score.engagement-score { color: var(--success, #16a34a); }
        .clarity-meta {
            font-size: 11px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            grid-row: 2;
        }
        .clarity-caveat {
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
            padding: 8px 0 0 0;
            line-height: 1.5;
        }
        .clarity-inline-empty {
            font-size: 12px;
            color: var(--text-muted);
            padding: 4px 0;
        }

        /* ── Anomaly panel (Panel D) ──────────────────────────────────────── */
        .anomaly-row {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
        }
        .anomaly-row:last-child { border-bottom: none; }
        .anomaly-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }
        .anomaly-url {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 0;
        }
        .anomaly-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
            white-space: nowrap;
        }
        .anomaly-badge.health   { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .anomaly-badge.friction { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
        .anomaly-badge.both     { background: rgba(220, 38, 38, 0.18); color: var(--danger); }
        .anomaly-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .anomaly-metric {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .anomaly-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
        }
        .anomaly-value {
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anomaly-delta {
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }
        .anomaly-delta.neg { color: var(--danger); }
        .anomaly-delta.pos { color: var(--success, #16a34a); }
        .anomaly-delta.muted { color: var(--text-muted); font-weight: 400; }
        @media (max-width: 700px) {
            .anomaly-grid { grid-template-columns: 1fr 1fr; }
        }
        .panel-warning {
            padding: 8px 18px;
            background: rgba(245, 158, 11, 0.08);
            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 11px;
            color: var(--warning, #b45309);
        }

        /* ── Active experiments table ── */
        table.experiments {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        table.experiments thead th {
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }
        table.experiments tbody tr {
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }
        table.experiments tbody tr.surface-row {
            transition: background 0.15s, border-left-color 0.2s;
            border-left: 2px solid transparent;
        }
        table.experiments tbody tr:hover {
            background: var(--surface-hover);
        }
        table.experiments tbody tr.surface-row.expanded {
            background: rgba(59, 130, 246, 0.06);
            border-left-color: var(--info);
        }
        table.experiments tbody tr.detail-row {
            border-left: 2px solid var(--info);
        }
        table.experiments td {
            padding: 10px 12px;
            vertical-align: middle;
        }
        table.experiments td.num {
            font-variant-numeric: tabular-nums;
        }
        .surface-cell {
            font-weight: 600;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            white-space: nowrap;
        }
        .surface-cell .disclosure {
            display: inline-block;
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
            transition: transform 0.15s;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            transform-origin: center;
        }
        tr.surface-row.expanded .surface-cell .disclosure {
            transform: rotate(90deg);
            color: var(--info);
        }

        /* ── Status pills ── */
        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pill-idle { background: rgba(139,143,163,0.15); color: var(--text-muted); }
        .pill-awaiting_approval { background: rgba(99,102,241,0.15); color: var(--accent-light); }
        .pill-canary { background: rgba(59,130,246,0.15); color: var(--info); }
        .pill-measuring { background: rgba(99,102,241,0.15); color: var(--accent-light); }
        .pill-analyzing { background: rgba(168,85,247,0.15); color: #c084fc; }
        .pill-decided { background: rgba(34,197,94,0.15); color: var(--success); }
        .pill-paused_for_review { background: rgba(245,158,11,0.15); color: var(--warning); }

        /* ── Detail (expanded row) ── */
        tr.detail-row { background: var(--surface) !important; cursor: default; }
        tr.detail-row td {
            padding: 0;
            border-bottom: 1px solid var(--border);
            text-align: left;        /* override table-cell default */
        }
        .detail-wrap {
            padding: 18px 22px 22px;
            text-align: left;
        }
        .detail-title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 10px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .detail-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
        }
        .detail-title .id {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 13px;
            color: var(--accent-light);
            margin-left: 6px;
        }
        .detail-subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 28px;
        }
        .detail-section {
            text-align: left;
            margin-bottom: 18px;
        }
        .detail-section:last-child { margin-bottom: 0; }
        .detail-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin: 0 0 8px 0;
            font-weight: 600;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }
        .detail-section p {
            font-size: 12px;
            line-height: 1.55;
            color: var(--text);
            margin: 0 0 8px 0;
        }
        .detail-section code {
            background: var(--bg);
            padding: 1px 6px;
            border-radius: 3px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 11px;
        }
        .files-changed {
            list-style: none;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 11px;
        }
        .files-changed li {
            padding: 2px 0;
            color: var(--text-muted);
        }

        /* ── Visualizations: metric delta bars ── */
        .metric-row {
            display: grid;
            /* label · current values (ctl/var) · bar · delta */
            grid-template-columns: 80px 145px 1fr 70px;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
            font-size: 11px;
        }
        .metric-row:last-child { margin-bottom: 6px; }
        .metric-label {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            color: var(--text);
            font-weight: 600;
        }
        .metric-values {
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }
        .metric-values .ctl-val { color: var(--info); font-weight: 600; }
        .metric-values .var-val { color: var(--accent-light); font-weight: 600; }
        .metric-bar-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .metric-bar {
            position: relative;
            height: 22px;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: visible;
        }
        .metric-bar .zero {
            position: absolute;
            left: 50%;
            top: -3px;
            bottom: -3px;
            width: 1px;
            background: var(--text);
            opacity: 0.65;
        }
        .metric-bar .threshold {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 2px;
            background: var(--text-muted);
            border-radius: 1px;
        }
        .metric-bar .threshold.danger { background: var(--danger); }
        .metric-bar .threshold.warning { background: var(--warning); }
        .metric-bar .fill {
            position: absolute;
            top: 2px;
            bottom: 2px;
            background: var(--info);
            border-radius: 3px;
            transition: width 0.3s, left 0.3s, background 0.3s;
        }
        .metric-bar .fill.healthy { background: var(--success); box-shadow: 0 0 6px rgba(34,197,94,0.45); }
        .metric-bar .fill.tier2 { background: var(--warning); box-shadow: 0 0 6px rgba(245,158,11,0.45); }
        .metric-bar .fill.tier1 { background: var(--danger); box-shadow: 0 0 6px rgba(239,68,68,0.45); }
        .metric-bar.empty {
            background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 4px, var(--surface-hover) 4px, var(--surface-hover) 8px);
        }
        /* Tick scale labels under each delta bar — absolute positioned to
           align exactly under the tick they describe. */
        .metric-scale {
            position: relative;
            height: 12px;
            font-size: 9px;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            user-select: none;
        }
        .metric-scale .tick-label {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            white-space: nowrap;
        }
        .metric-scale .tick-label.zero { color: var(--text-muted); opacity: 0.7; }
        .metric-scale .tick-label.danger { color: var(--danger); font-weight: 700; }
        .metric-scale .tick-label.warning { color: var(--warning); font-weight: 700; }
        .metric-delta {
            font-variant-numeric: tabular-nums;
            text-align: right;
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
        }
        .metric-delta.muted { color: var(--text-muted); font-weight: 400; font-size: 12px; }
        .metric-delta.pos { color: var(--success); }
        .metric-delta.neg { color: var(--danger); }

        /* ── Sample size bar ── */
        .sample-bar {
            display: flex;
            height: 28px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg);
            border: 1px solid var(--border);
            margin-bottom: 8px;
            gap: 2px;
            padding: 2px;
        }
        .sample-bar .control {
            background: var(--info);
            border-radius: 4px;
            min-width: 6px;
            transition: width 0.3s;
        }
        .sample-bar .variant {
            background: var(--accent-light);
            border-radius: 4px;
            min-width: 6px;
            transition: width 0.3s;
        }
        .sample-legend {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }
        .sample-legend .ctl { color: var(--info); font-weight: 700; }
        .sample-legend .var { color: var(--accent-light); font-weight: 700; }
        .sample-legend .pct { color: var(--text-muted); font-weight: 400; margin-left: 4px; opacity: 0.8; }

        /* ── Phase timeline ── */
        .phase-timeline {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .phase-pill-tl {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .phase-pill-tl.done { color: var(--success); border-color: rgba(34,197,94,0.3); }
        .phase-pill-tl.current { color: var(--info); border-color: var(--info); background: rgba(59,130,246,0.08); }
        .phase-timeline-meta {
            font-size: 10px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* ── Awaiting-data placeholder ── */
        .awaiting {
            font-style: italic;
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 0;
        }

        .phase-history {
            list-style: none;
            font-size: 11px;
        }
        .phase-history li {
            padding: 4px 0;
            display: flex;
            gap: 10px;
            border-left: 2px solid var(--border);
            padding-left: 10px;
            margin-left: 4px;
        }
        .phase-history .ts {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 130px;
            flex-shrink: 0;
        }

        /* ── Performance memory ── */
        .pm-section { margin-bottom: 8px; }
        .pm-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .pm-toggle:hover { background: var(--surface-hover); }
        .pm-toggle .arrow {
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.15s;
        }
        .pm-section.open .arrow { transform: rotate(90deg); }
        .pm-toggle-text {
            flex: 1;
            font-size: 13px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            text-align: left;
        }
        .pm-meta { font-size: 11px; color: var(--text-muted); }
        .pm-content {
            display: none;
            padding: 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .pm-inner {
            padding: 18px 24px 22px;
            text-align: left;
        }
        /* PM Stats strip — 4 tiles at the top of an expanded surface */
        .pm-stats-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            padding: 14px 18px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.015);
        }
        .pm-stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .pm-stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .pm-stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .pm-stat-value.gradient {
            background: linear-gradient(135deg, var(--gold) 0%, var(--success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .pm-stat-value.muted { color: var(--text-muted); font-weight: 600; font-size: 16px; }
        .pm-stat-meta {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Win-rate visual: row of dots, last N cycles */
        .pm-winrate-dots {
            display: flex;
            gap: 3px;
            margin-top: 4px;
        }
        .pm-winrate-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }
        .pm-winrate-dot.keep { background: var(--success); }
        .pm-winrate-dot.discard { background: var(--danger); }
        .pm-winrate-dot.inconclusive { background: var(--warning); }
        .pm-winrate-dot.reverted { background: var(--text-muted); border: 1px solid var(--danger); }

        /* PM 2-column layout */
        .pm-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 28px;
            padding: 18px 24px 22px;
        }
        .pm-section-block { margin-bottom: 18px; }
        .pm-section-block:last-child { margin-bottom: 0; }
        .pm-section-block h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin: 0 0 8px 0;
            font-weight: 600;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .pm-section-block h3 .badge {
            font-size: 10px;
            background: var(--bg);
            color: var(--text-muted);
            padding: 1px 7px;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .pm-section-block h3 .badge.accent {
            background: rgba(99,102,241,0.15);
            color: var(--accent-light);
        }

        /* Cycle ledger / pattern entries */
        .cycle-row {
            display: grid;
            grid-template-columns: 16px 1fr 70px 70px;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 12px;
            align-items: center;
        }
        .cycle-row:last-child { border-bottom: none; }
        .cycle-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            justify-self: center;
        }
        .cycle-dot.keep { background: var(--success); box-shadow: 0 0 0 2px rgba(34,197,94,0.15); }
        .cycle-dot.discard { background: var(--danger); }
        .cycle-dot.inconclusive { background: var(--warning); }
        .cycle-dot.reverted { background: var(--danger); border: 2px solid var(--text-muted); }
        .cycle-meta {
            color: var(--text);
            line-height: 1.4;
        }
        .cycle-meta .cycle-tag {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            color: var(--accent-light);
            margin-right: 6px;
        }
        .cycle-meta .cycle-desc { color: var(--text); }
        .cycle-lift {
            font-variant-numeric: tabular-nums;
            text-align: right;
            font-weight: 600;
        }
        .cycle-lift.pos { color: var(--success); }
        .cycle-lift.neg { color: var(--danger); }
        .cycle-lift.flat { color: var(--text-muted); }
        .cycle-date {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Open Questions backlog */
        .pm-question-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .pm-question-list li {
            padding: 6px 0 6px 16px;
            font-size: 12px;
            color: var(--text);
            line-height: 1.45;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .pm-question-list li:last-child { border-bottom: none; }
        .pm-question-list li::before {
            content: "?";
            position: absolute;
            left: 0;
            top: 6px;
            color: var(--accent-light);
            font-weight: 700;
            font-size: 12px;
        }

        /* Cross-surface insights / preamble — free-form markdown */
        .pm-prose {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text);
        }
        .pm-prose p { margin: 0 0 8px 0; }
        .pm-prose ul, .pm-prose ol { padding-left: 22px; margin: 4px 0 8px 0; }
        .pm-prose li { margin: 2px 0; }
        .pm-prose code {
            background: var(--bg);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            color: var(--accent-light);
        }
        .pm-prose strong { color: var(--text); font-weight: 600; }
        .pm-prose em { color: var(--text-muted); font-style: italic; }

        .pm-empty {
            padding: 12px 0;
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
        }
        .pm-section-block.danger h3 { color: var(--danger); }
        .pm-section-block.danger { border-left: 2px solid var(--danger); padding-left: 10px; }
        .pm-section.open .pm-content { display: block; }
        /* Heading hierarchy — explicit, left-aligned, with section borders */
        .pm-content h1 {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: var(--text);
            text-align: left;
        }
        .pm-content h2 {
            font-size: 12px;
            font-weight: 600;
            margin: 18px 0 6px 0;
            padding-bottom: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .pm-content h3 {
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0 4px 0;
            color: var(--text);
            text-align: left;
        }
        .pm-content p {
            margin: 0 0 8px 0;
            text-align: left;
        }
        .pm-content blockquote {
            border-left: 2px solid var(--border);
            margin: 8px 0;
            padding: 4px 0 4px 12px;
            color: var(--text-muted);
            font-size: 12px;
            font-style: normal;
        }
        .pm-content ul, .pm-content ol {
            padding-left: 22px;
            margin: 4px 0 10px 0;
            text-align: left;
        }
        .pm-content li {
            margin: 2px 0;
            color: var(--text);
            text-align: left;
        }
        .pm-content li > strong:first-child {
            color: var(--text-muted);
            font-weight: 600;
        }
        .pm-content em {
            color: var(--text-muted);
            font-style: italic;
        }
        .pm-content code {
            background: var(--bg);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            color: var(--accent-light);
        }
        .pm-content strong {
            color: var(--text);
            font-weight: 600;
        }
        .pm-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 14px 0;
        }

        /* ── System health (footer) ── */
        .health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            padding: 14px 18px;
        }
        .health-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .health-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .health-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .health-value.muted { color: var(--text-muted); font-weight: 400; }

        .footnote {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 12px;
        }

        /* ── Loading + error states ── */
        .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 13px; }
        .error {
            border: 1px solid var(--danger);
            background: rgba(239,68,68,0.06);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <div class="header-left">
                <h1>Website Experiment Dashboard</h1>
                <div class="subtitle">PDP / collection / cart CRO experiments — current state, history, learnings</div>
            </div>
            <div class="header-right">
                <button id="refreshBtn" class="refresh-btn">↻ Refresh</button>
                <div id="lastRefresh" class="last-refresh">—</div>
            </div>
        </header>

        <div id="errorBanner"></div>

        <div id="content" class="loading">Loading experiment state…</div>
    </div>

    <script>
        // ─── DATA SOURCES ─────────────────────────────────────────────────────
        const STATE_URL = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/auto-optimize/state.json';
        const CLARITY_SNAPSHOTS_BASE = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/clarity/snapshots/';
        const CLARITY_RUBRIC_URL = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/clarity/clarity-rubric.json';
        const SURFACES_LIST = ['pdp-atc'];  // expand as new surfaces ship
        const SURFACE_CONFIG_BASE = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/auto-optimize/surfaces/';
        const PERF_MEMORY_BASE = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/performance-memory/';

        // ─── STATE ─────────────────────────────────────────────────────────────
        let appState = {
            stateJson: null,
            surfaces: {},      // surface_id → yaml object
            performance: {},   // surface_id → markdown string
            clarity: null,     // most recent clarity snapshot, or null
            clarityRubric: null,
            error: null,
            loadedAt: null,
        };

        // ─── DATA FETCH ────────────────────────────────────────────────────────
        async function fetchJson(url) {
            const r = await fetch(url + '?t=' + Date.now());
            if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
            return r.json();
        }
        async function fetchText(url) {
            const r = await fetch(url + '?t=' + Date.now());
            if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
            return r.text();
        }

        async function loadAll() {
            appState.error = null;
            try {
                appState.stateJson = await fetchJson(STATE_URL);
            } catch (e) {
                appState.error = `state.json fetch failed: ${e.message}. Has the sync workflow run yet?`;
                return;
            }

            // Surface configs (per surface from SURFACES_LIST; tolerate misses)
            for (const surface of SURFACES_LIST) {
                try {
                    const yaml = await fetchText(SURFACE_CONFIG_BASE + surface + '.yaml');
                    appState.surfaces[surface] = jsyaml.load(yaml);
                } catch (e) {
                    appState.surfaces[surface] = null;
                }
                try {
                    appState.performance[surface] = await fetchText(PERF_MEMORY_BASE + surface + '.md');
                } catch (e) {
                    appState.performance[surface] = null;
                }
            }

            // Clarity snapshot — try today (UTC), fall back to most-recent up to 5 days back.
            // Cron writes daily at 06:00 UTC; sync fires on commit. By the time anyone
            // views the dashboard (typically post-09:00 ET = post-13:00 UTC) today's
            // file should exist. Fallback handles cron-failed days cleanly.
            for (let i = 0; i < 5; i++) {
                const d = new Date(Date.now() - i * 86400000);
                const iso = d.toISOString().slice(0, 10);   // YYYY-MM-DD UTC
                try {
                    appState.clarity = await fetchJson(CLARITY_SNAPSHOTS_BASE + iso + '.json');
                    break;
                } catch (e) {
                    // try previous day
                }
            }
            try {
                appState.clarityRubric = await fetchJson(CLARITY_RUBRIC_URL);
            } catch (e) {
                appState.clarityRubric = null;
            }

            appState.loadedAt = new Date();
        }

        // ─── HELPERS ───────────────────────────────────────────────────────────
        function fmtRelative(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return 'just now';
            if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
            return `${Math.floor(diff/86400)}d ago`;
        }
        function fmtTimeAbs(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toISOString().slice(0,16).replace('T',' ') + 'Z';
        }
        function timeInPhase(exp) {
            const phase = exp.phase || 'idle';
            if (phase === 'idle') return '—';
            if (phase === 'canary') {
                const start = exp.canary_started_at;
                if (!start) return '—';
                const elapsedH = (Date.now() - new Date(start).getTime()) / 3600000;
                const remainingH = 24 - elapsedH;
                if (remainingH > 0) return `${remainingH.toFixed(1)}h until ramp`;
                return `Canary +${elapsedH.toFixed(1)}h`;
            }
            if (phase === 'measuring') {
                const start = exp.measurement_started_at;
                if (!start) return '—';
                const days = (Date.now() - new Date(start).getTime()) / 86400000;
                const total = exp.measurement_window_days || 7;
                return `Day ${Math.floor(days)+1} of ${total}`;
            }
            if (phase === 'awaiting_approval') {
                const ph = exp.phase_history || [];
                const last = ph[ph.length-1];
                if (!last) return '—';
                const hoursWaiting = (Date.now() - new Date(last.entered_at).getTime()) / 3600000;
                return `Waiting ${hoursWaiting.toFixed(0)}h`;
            }
            return phase;
        }
        function slackThreadUrl(threadTs) {
            if (!threadTs) return null;
            const ts = threadTs.replace('.', '');
            return `https://kenetikslack.slack.com/archives/C0AN37DLDKQ/p${ts}`;
        }
        function previewUrl(exp) {
            if (!exp.preview_theme_id) return null;
            return `https://ketoneelixir.myshopify.com/?preview_theme_id=${exp.preview_theme_id}`;
        }

        // ─── ACTION QUEUE ──────────────────────────────────────────────────────
        function buildActionQueue() {
            const items = [];
            const exps = appState.stateJson?.experiments || {};

            for (const [surface, exp] of Object.entries(exps)) {
                const phase = exp.phase || 'idle';

                // Hypothesis awaiting approval (>0h)
                if (phase === 'awaiting_approval') {
                    const ph = exp.phase_history || [];
                    const last = ph[ph.length-1];
                    const hoursWaiting = last ? (Date.now() - new Date(last.entered_at).getTime()) / 3600000 : 0;
                    items.push({
                        cls: hoursWaiting > 24 ? 'warning' : 'info',
                        icon: hoursWaiting > 24 ? '🔔' : '👀',
                        text: `<strong>Approve hypothesis on <code>${exp.experiment_id}</code></strong> · ${surface} · waiting ${hoursWaiting.toFixed(0)}h`,
                        meta: (exp.hypothesis || '').slice(0, 100) + ((exp.hypothesis || '').length > 100 ? '…' : ''),
                        cta_label: 'Reply in Slack →',
                        cta_url: slackThreadUrl(exp.slack_thread_ts),
                    });
                }

                // Tier-1 / tier-2 breach (read from latest guardrail_check)
                const checks = exp.guardrail_checks || [];
                const last = checks[checks.length-1];
                if (last && last.result && last.result.includes('breach')) {
                    const isTier1 = last.result === 'tier1_breach';
                    items.push({
                        cls: isTier1 ? 'danger' : 'warning',
                        icon: isTier1 ? '🚨' : '⚠️',
                        text: `<strong>${isTier1 ? 'TIER-1 BREACH' : 'Tier-2 advisory'} on <code>${exp.experiment_id}</code></strong> · ${last.metric} ${(last.delta_pct >= 0 ? '+' : '')}${(last.delta_pct*100).toFixed(1)}% (threshold ${(last.threshold_pct*100).toFixed(0)}%)`,
                        meta: `Action: ${last.action_taken} · snapshot ${fmtRelative(last.snapshot_at)}`,
                        cta_label: 'View thread →',
                        cta_url: slackThreadUrl(exp.slack_thread_ts),
                    });
                }

                // decided phase awaiting confirmation
                if (phase === 'decided') {
                    items.push({
                        cls: 'info',
                        icon: '✅',
                        text: `<strong>Confirm decision on <code>${exp.experiment_id}</code></strong> · ${surface}`,
                        meta: 'Bayesian analysis complete; final keep/discard awaiting confirmation.',
                        cta_label: 'Reply in Slack →',
                        cta_url: slackThreadUrl(exp.slack_thread_ts),
                    });
                }
            }

            return items;
        }

        // ─── RENDER ────────────────────────────────────────────────────────────
        function renderError() {
            const eb = document.getElementById('errorBanner');
            if (appState.error) {
                eb.innerHTML = `<div class="error">${appState.error}</div>`;
            } else {
                eb.innerHTML = '';
            }
        }

        function renderActionQueue() {
            const items = buildActionQueue();
            if (!items.length) {
                return `
                    <div class="panel compact-empty">
                        <div class="panel-header">
                            <div class="panel-title">Action Queue</div>
                            <div class="panel-meta">Nothing waiting on you · system running cleanly</div>
                        </div>
                    </div>`;
            }
            const rows = items.map(it => `
                <div class="action-row ${it.cls}">
                    <div class="action-icon">${it.icon}</div>
                    <div class="action-text">
                        ${it.text}
                        ${it.meta ? `<div class="meta">${it.meta}</div>` : ''}
                    </div>
                    ${it.cta_url ? `<a class="action-cta" href="${it.cta_url}" target="_blank">${it.cta_label}</a>` : ''}
                </div>`).join('');
            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Action Queue</div>
                        <div class="panel-meta">${items.length} item${items.length === 1 ? '' : 's'}</div>
                    </div>
                    <div class="panel-body">${rows}</div>
                </div>`;
        }

        function renderActiveExperiments() {
            const exps = appState.stateJson?.experiments || {};
            const surfaces = SURFACES_LIST;  // shows ALL configured surfaces

            const rows = surfaces.map(surface => {
                const exp = exps[surface];
                if (!exp) {
                    return `
                        <tr class="surface-${surface}">
                            <td class="surface-cell"><span class="disclosure" style="opacity: 0.3">▶</span>${surface}</td>
                            <td><span class="pill pill-idle">no entry</span></td>
                            <td colspan="6" class="num" style="color: var(--text-muted)">No experiment record yet</td>
                            <td></td>
                        </tr>`;
                }
                const phase = exp.phase || 'idle';
                const variantSessions = exp.current_metrics?.variant?.sessions ?? 0;
                const controlSessions = exp.current_metrics?.control?.sessions ?? 0;
                const previewUrlVal = previewUrl(exp);
                const slackUrl = slackThreadUrl(exp.slack_thread_ts);

                const dataRow = `
                    <tr class="surface-row" data-surface="${surface}" onclick="toggleDetail('${surface}')">
                        <td class="surface-cell"><span class="disclosure">▶</span>${surface}</td>
                        <td><span class="pill pill-${phase}">${phase.replace('_',' ')}</span></td>
                        <td class="num">${exp.cycle_tag || exp.experiment_id || '—'}</td>
                        <td class="num">${timeInPhase(exp)}</td>
                        <td class="num" style="color: var(--text-muted)">— GA4 pending</td>
                        <td class="num" style="color: var(--text-muted)">— GA4 pending</td>
                        <td class="num">${controlSessions.toLocaleString()} / ${variantSessions.toLocaleString()}</td>
                        <td class="num">${renderGuardrailDots(exp)}</td>
                        <td>${previewUrlVal ? `<a href="${previewUrlVal}" target="_blank" onclick="event.stopPropagation()">🔗</a>` : '—'}</td>
                        <td>${slackUrl ? `<a href="${slackUrl}" target="_blank" onclick="event.stopPropagation()">💬</a>` : '—'}</td>
                    </tr>
                    <tr class="detail-row" id="detail-${surface}" style="display: none;">
                        <td colspan="10">${renderDetail(surface, exp)}</td>
                    </tr>`;
                return dataRow;
            }).join('');

            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Active Experiments</div>
                        <div class="panel-meta">${surfaces.length} surface${surfaces.length === 1 ? '' : 's'} configured · click row for detail</div>
                    </div>
                    <div class="panel-body">
                        <table class="experiments">
                            <thead>
                                <tr>
                                    <th>Surface</th>
                                    <th>Status</th>
                                    <th>Cycle</th>
                                    <th>Time</th>
                                    <th>Primary metric</th>
                                    <th>Confidence</th>
                                    <th>Sessions (c/v)</th>
                                    <th>Guardrails</th>
                                    <th>Preview</th>
                                    <th>Slack</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        function renderGuardrailDots(exp) {
            const checks = exp.guardrail_checks || [];
            const last = checks[checks.length-1];
            if (!last) return '<span style="color: var(--text-muted)">— no checks</span>';
            if (last.result === 'healthy') {
                return `<span style="color: var(--success)" title="Last check ${fmtRelative(last.checked_at)}">● healthy</span>`;
            }
            if (last.result === 'tier1_breach') {
                return `<span style="color: var(--danger)" title="${last.metric} ${(last.delta_pct*100).toFixed(1)}%">🚨 tier-1</span>`;
            }
            if (last.result === 'tier2_breach') {
                return `<span style="color: var(--warning)" title="${last.metric} ${(last.delta_pct*100).toFixed(1)}%">⚠ tier-2</span>`;
            }
            return last.result;
        }

        function renderDetail(surface, exp) {
            const surfaceCfg = appState.surfaces[surface];

            // ── Title row ──
            const seededBy = exp.seeded_by ? ` · seeded by ${exp.seeded_by}` : '';

                    </div>

            // ── Performance visual (sample size + per-metric delta bars) ──

            const timelineHtml = renderPhaseTimeline(exp);

            // ── Guardrail status visual (per-metric current standing vs thresholds) ──
            const guardrailHtml = renderGuardrailVisual(metrics, surfaceCfg);

            // ── Recent guardrail checks (compact timeline) ──
            const recentChecksHtml = guardrailChecks.length ? `
                <ul class="phase-history">
                    ${guardrailChecks.map(c => {
                        const dot = c.result === 'healthy' ? '🟢' :
                                    c.result === 'tier1_breach' ? '🔴' :
                                    c.result === 'tier2_breach' ? '🟡' : '⚪';
                        const detail = c.metric
                            ? ` · ${c.metric} ${(c.delta_pct * 100).toFixed(1)}%`

                        return `<li>
                            <span class="ts">${fmtTimeAbs(c.checked_at)}</span>
                            <span>${dot} ${c.result}${detail}${c.action_taken && c.action_taken !== 'none' ? ` → ${c.action_taken}` : ''}</span>

            // ── Phase history (chronological list, full detail) ──
            const phaseHistoryHtml = phaseHistory.length ? `
                <ul class="phase-history">
                    ${phaseHistory.map(p => `
                        <li>
                            <span class="ts">${fmtTimeAbs(p.entered_at)}</span>
                            <span>${p.phase}${p.reason ? ` — ${p.reason}` : ''}</span>

            return `
                <div class="detail-wrap">
                    ${titleHtml}
                    <div class="detail-grid">
                        <div>
                            <div class="detail-section">

                            </div>
                            <div class="detail-section">
                                <h3>Performance vs Control</h3>
                                ${performanceHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Guardrail Status</h3>
                                ${guardrailHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Recent Guardrail Checks (last 8)</h3>
                                ${recentChecksHtml}
                            </div>
                        </div>
                        <div>
                            <div class="detail-section">
                                <h3>Phase Timeline</h3>
                                ${timelineHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Behavioral Friction (Clarity, surface-level)</h3>
                                ${renderExperimentClarity(surface, exp, surfaceCfg)}
                            </div>
                            <div class="detail-section">
                                <h3>Phase History</h3>
                                ${phaseHistoryHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Files Changed</h3>
                                <ul class="files-changed">
                                    ${filesChanged.length ? filesChanged.map(f => `<li>${f}</li>`).join('') : '<li><em>None recorded</em></li>'}

                                <h3>Branch / Preview Theme</h3>
