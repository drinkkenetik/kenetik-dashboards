<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenetik Website Experiment Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #22262f;
            --border: #2a2e3a;
            --text: #e4e4e7;
            --text-muted: #8b8fa3;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --kenetik-green: #22c55e;
            --gold: #fbbf24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Animations (subtle, used sparingly) ── */
        @keyframes pulse-fade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            50% { box-shadow: 0 0 0 4px rgba(34,197,94,0); }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse { animation: pulse-fade 2.4s ease-in-out infinite; }
        .pulse-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 5px;
            vertical-align: middle;
            animation: pulse-dot 2s ease-out infinite;
        }
        .pulse-dot.warn { background: var(--warning); animation-name: pulse-dot; box-shadow: 0 0 0 0 rgba(245,158,11,0.4); }
        .pulse-dot.muted { background: var(--text-muted); animation: none; }

        a { color: var(--accent-light); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .dashboard {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-left h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.6px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--info) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .subtitle {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── Stats bar (at-a-glance system status) ── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.15s, transform 0.15s;
        }
        .stat-card:hover {
            border-color: rgba(99,102,241,0.4);
            transform: translateY(-1px);
        }
        .stat-card-label {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
        }
        .stat-card-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .stat-card-value.gradient {
            background: linear-gradient(135deg, var(--gold) 0%, var(--info) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .refresh-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .last-refresh {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── Section panels ── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 14px;
            overflow: hidden;
            animation: fade-in-up 0.3s ease;
        }
        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .panel-meta {
            font-size: 11px;
            color: var(--text-muted);
        }
        .panel-body {
            padding: 0;
        }
        .panel-body.padded { padding: 14px 18px; }
        .panel-empty {
            padding: 14px 18px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        /* Inline empty states — for panels where the empty state is the
           normal steady state and shouldn't dominate the screen. */
        .panel.compact-empty .panel-empty {
            padding: 10px 18px;
            text-align: left;
            font-style: italic;
        }

        /* ── Action queue items ── */
        .action-row {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid var(--info);
        }
        .action-row:last-child { border-bottom: none; }
        .action-row.danger { border-left-color: var(--danger); background: rgba(239,68,68,0.04); }
        .action-row.warning { border-left-color: var(--warning); background: rgba(245,158,11,0.04); }
        .action-row.info { border-left-color: var(--info); }
        .action-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .action-text {
            flex: 1;
            font-size: 13px;
        }
        .action-text strong { color: var(--text); }
        .action-text .meta {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 2px;
        }
        .action-cta {
            font-size: 11px;
            color: var(--accent-light);
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            white-space: nowrap;
        }
        .action-cta:hover { border-color: var(--accent); text-decoration: none; }

        /* ── Active experiments table ── */
        table.experiments {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        table.experiments thead th {
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }
        table.experiments tbody tr {
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }
        table.experiments tbody tr.surface-row {
            transition: background 0.15s, border-left-color 0.2s;
            border-left: 2px solid transparent;
        }
        table.experiments tbody tr:hover {
            background: var(--surface-hover);
        }
        table.experiments tbody tr.surface-row.expanded {
            background: rgba(59, 130, 246, 0.06);
            border-left-color: var(--info);
        }
        table.experiments tbody tr.detail-row {
            border-left: 2px solid var(--info);
        }
        table.experiments td {
            padding: 10px 12px;
            vertical-align: middle;
        }
        table.experiments td.num {
            font-variant-numeric: tabular-nums;
        }
        .surface-cell {
            font-weight: 600;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
        }

        /* ── Status pills ── */
        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pill-idle { background: rgba(139,143,163,0.15); color: var(--text-muted); }
        .pill-awaiting_approval { background: rgba(99,102,241,0.15); color: var(--accent-light); }
        .pill-canary { background: rgba(59,130,246,0.15); color: var(--info); }
        .pill-measuring { background: rgba(99,102,241,0.15); color: var(--accent-light); }
        .pill-analyzing { background: rgba(168,85,247,0.15); color: #c084fc; }
        .pill-decided { background: rgba(34,197,94,0.15); color: var(--success); }
        .pill-paused_for_review { background: rgba(245,158,11,0.15); color: var(--warning); }

        /* ── Detail (expanded row) ── */
        tr.detail-row { background: var(--surface) !important; cursor: default; }
        tr.detail-row td {
            padding: 0;
            border-bottom: 1px solid var(--border);
            text-align: left;        /* override table-cell default */
        }
        .detail-wrap {
            padding: 18px 22px 22px;
            text-align: left;
        }
        .detail-title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 10px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .detail-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
        }
        .detail-title .id {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 13px;
            color: var(--accent-light);
            margin-left: 6px;
        }
        .detail-subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 28px;
        }
        .detail-section {
            text-align: left;
            margin-bottom: 18px;
        }
        .detail-section:last-child { margin-bottom: 0; }
        .detail-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin: 0 0 8px 0;
            font-weight: 600;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }
        .detail-section p {
            font-size: 12px;
            line-height: 1.55;
            color: var(--text);
            margin: 0 0 8px 0;
        }
        .detail-section code {
            background: var(--bg);
            padding: 1px 6px;
            border-radius: 3px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 11px;
        }
        .files-changed {
            list-style: none;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 11px;
        }
        .files-changed li {
            padding: 2px 0;
            color: var(--text-muted);
        }

        /* ── Visualizations: metric delta bars ── */
        .metric-row {
            display: grid;
            grid-template-columns: 90px 1fr 80px;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
        }
        .metric-row:last-child { margin-bottom: 0; }
        .metric-label {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            color: var(--text);
        }
        .metric-bar {
            position: relative;
            height: 14px;
            background: var(--bg);
            border-radius: 3px;
            overflow: visible;
        }
        .metric-bar .zero {
            position: absolute;
            left: 50%;
            top: -2px;
            bottom: -2px;
            width: 1px;
            background: var(--border);
        }
        .metric-bar .threshold {
            position: absolute;
            top: -3px;
            bottom: -3px;
            width: 1px;
            background: var(--text-muted);
            opacity: 0.5;
        }
        .metric-bar .threshold.danger { background: var(--danger); opacity: 0.6; }
        .metric-bar .threshold.warning { background: var(--warning); opacity: 0.6; }
        .metric-bar .fill {
            position: absolute;
            top: 1px;
            bottom: 1px;
            background: var(--info);
            border-radius: 2px;
            transition: width 0.3s, left 0.3s, background 0.3s;
        }
        .metric-bar .fill.healthy { background: var(--success); }
        .metric-bar .fill.tier2 { background: var(--warning); }
        .metric-bar .fill.tier1 { background: var(--danger); }
        .metric-bar.empty {
            background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 3px, var(--surface-hover) 3px, var(--surface-hover) 6px);
        }
        .metric-delta {
            font-variant-numeric: tabular-nums;
            text-align: right;
            color: var(--text);
            font-size: 11px;
        }
        .metric-delta.muted { color: var(--text-muted); }

        /* ── Sample size bar ── */
        .sample-bar {
            display: flex;
            height: 18px;
            border-radius: 3px;
            overflow: hidden;
            background: var(--bg);
            margin-bottom: 6px;
        }
        .sample-bar .control {
            background: var(--info);
            opacity: 0.75;
            transition: width 0.3s;
        }
        .sample-bar .variant {
            background: var(--accent);
            opacity: 0.85;
            transition: width 0.3s;
        }
        .sample-legend {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .sample-legend .ctl { color: var(--info); }
        .sample-legend .var { color: var(--accent-light); }

        /* ── Phase timeline ── */
        .phase-timeline {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .phase-pill-tl {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .phase-pill-tl.done { color: var(--success); border-color: rgba(34,197,94,0.3); }
        .phase-pill-tl.current { color: var(--info); border-color: var(--info); background: rgba(59,130,246,0.08); }
        .phase-timeline-meta {
            font-size: 10px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* ── Awaiting-data placeholder ── */
        .awaiting {
            font-style: italic;
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 0;
        }

        .phase-history {
            list-style: none;
            font-size: 11px;
        }
        .phase-history li {
            padding: 4px 0;
            display: flex;
            gap: 10px;
            border-left: 2px solid var(--border);
            padding-left: 10px;
            margin-left: 4px;
        }
        .phase-history .ts {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 130px;
            flex-shrink: 0;
        }

        /* ── Performance memory ── */
        .pm-section { margin-bottom: 8px; }
        .pm-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .pm-toggle:hover { background: var(--surface-hover); }
        .pm-toggle .arrow {
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.15s;
        }
        .pm-section.open .arrow { transform: rotate(90deg); }
        .pm-toggle-text {
            flex: 1;
            font-size: 13px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
        }
        .pm-meta { font-size: 11px; color: var(--text-muted); }
        .pm-content {
            display: none;
            padding: 18px 24px 22px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            text-align: left;
            max-width: 900px;       /* readable line length cap */
        }
        .pm-section.open .pm-content { display: block; }
        /* Heading hierarchy — explicit, left-aligned, with section borders */
        .pm-content h1 {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: var(--text);
            text-align: left;
        }
        .pm-content h2 {
            font-size: 12px;
            font-weight: 600;
            margin: 18px 0 6px 0;
            padding-bottom: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .pm-content h3 {
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0 4px 0;
            color: var(--text);
            text-align: left;
        }
        .pm-content p {
            margin: 0 0 8px 0;
            text-align: left;
        }
        .pm-content blockquote {
            border-left: 2px solid var(--border);
            margin: 8px 0;
            padding: 4px 0 4px 12px;
            color: var(--text-muted);
            font-size: 12px;
            font-style: normal;
        }
        .pm-content ul, .pm-content ol {
            padding-left: 22px;
            margin: 4px 0 10px 0;
            text-align: left;
        }
        .pm-content li {
            margin: 2px 0;
            color: var(--text);
            text-align: left;
        }
        .pm-content li > strong:first-child {
            color: var(--text-muted);
            font-weight: 600;
        }
        .pm-content em {
            color: var(--text-muted);
            font-style: italic;
        }
        .pm-content code {
            background: var(--bg);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            color: var(--accent-light);
        }
        .pm-content strong {
            color: var(--text);
            font-weight: 600;
        }
        .pm-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 14px 0;
        }

        /* ── System health (footer) ── */
        .health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            padding: 14px 18px;
        }
        .health-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .health-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .health-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .health-value.muted { color: var(--text-muted); font-weight: 400; }

        .footnote {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 12px;
        }

        /* ── Loading + error states ── */
        .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 13px; }
        .error {
            border: 1px solid var(--danger);
            background: rgba(239,68,68,0.06);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <div class="header-left">
                <h1>Website Experiment Dashboard</h1>
                <div class="subtitle">PDP / collection / cart CRO experiments — current state, history, learnings</div>
            </div>
            <div class="header-right">
                <button id="refreshBtn" class="refresh-btn">↻ Refresh</button>
                <div id="lastRefresh" class="last-refresh">—</div>
            </div>
        </header>

        <div id="errorBanner"></div>

        <div id="content" class="loading">Loading experiment state…</div>
    </div>

    <script>
        // ─── DATA SOURCES ─────────────────────────────────────────────────────
        const STATE_URL = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/auto-optimize/state.json';
        const SURFACES_LIST = ['pdp-atc'];  // expand as new surfaces ship
        const SURFACE_CONFIG_BASE = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/auto-optimize/surfaces/';
        const PERF_MEMORY_BASE = 'https://raw.githubusercontent.com/drinkkenetik/kenetik-dashboards/main/data/performance-memory/';

        // ─── STATE ─────────────────────────────────────────────────────────────
        let appState = {
            stateJson: null,
            surfaces: {},      // surface_id → yaml object
            performance: {},   // surface_id → markdown string
            error: null,
            loadedAt: null,
        };

        // ─── DATA FETCH ────────────────────────────────────────────────────────
        async function fetchJson(url) {
            const r = await fetch(url + '?t=' + Date.now());
            if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
            return r.json();
        }
        async function fetchText(url) {
            const r = await fetch(url + '?t=' + Date.now());
            if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
            return r.text();
        }

        async function loadAll() {
            appState.error = null;
            try {
                appState.stateJson = await fetchJson(STATE_URL);
            } catch (e) {
                appState.error = `state.json fetch failed: ${e.message}. Has the sync workflow run yet?`;
                return;
            }

            // Surface configs (per surface from SURFACES_LIST; tolerate misses)
            for (const surface of SURFACES_LIST) {
                try {
                    const yaml = await fetchText(SURFACE_CONFIG_BASE + surface + '.yaml');
                    appState.surfaces[surface] = jsyaml.load(yaml);
                } catch (e) {
                    appState.surfaces[surface] = null;
                }
                try {
                    appState.performance[surface] = await fetchText(PERF_MEMORY_BASE + surface + '.md');
                } catch (e) {
                    appState.performance[surface] = null;
                }
            }

            appState.loadedAt = new Date();
        }

        // ─── HELPERS ───────────────────────────────────────────────────────────
        function fmtRelative(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return 'just now';
            if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
            return `${Math.floor(diff/86400)}d ago`;
        }
        function fmtTimeAbs(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toISOString().slice(0,16).replace('T',' ') + 'Z';
        }
        function timeInPhase(exp) {
            const phase = exp.phase || 'idle';
            if (phase === 'idle') return '—';
            if (phase === 'canary') {
                const start = exp.canary_started_at;
                if (!start) return '—';
                const elapsedH = (Date.now() - new Date(start).getTime()) / 3600000;
                const remainingH = 24 - elapsedH;
                if (remainingH > 0) return `${remainingH.toFixed(1)}h until ramp`;
                return `Canary +${elapsedH.toFixed(1)}h`;
            }
            if (phase === 'measuring') {
                const start = exp.measurement_started_at;
                if (!start) return '—';
                const days = (Date.now() - new Date(start).getTime()) / 86400000;
                const total = exp.measurement_window_days || 7;
                return `Day ${Math.floor(days)+1} of ${total}`;
            }
            if (phase === 'awaiting_approval') {
                const ph = exp.phase_history || [];
                const last = ph[ph.length-1];
                if (!last) return '—';
                const hoursWaiting = (Date.now() - new Date(last.entered_at).getTime()) / 3600000;
                return `Waiting ${hoursWaiting.toFixed(0)}h`;
            }
            return phase;
        }
        function slackThreadUrl(threadTs) {
            if (!threadTs) return null;
            const ts = threadTs.replace('.', '');
            return `https://kenetikslack.slack.com/archives/C0AN37DLDKQ/p${ts}`;
        }
        function previewUrl(exp) {
            if (!exp.preview_theme_id) return null;
            return `https://ketoneelixir.myshopify.com/?preview_theme_id=${exp.preview_theme_id}`;
        }

        // ─── ACTION QUEUE ──────────────────────────────────────────────────────
        function buildActionQueue() {
            const items = [];
            const exps = appState.stateJson?.experiments || {};

            for (const [surface, exp] of Object.entries(exps)) {
                const phase = exp.phase || 'idle';

                // Hypothesis awaiting approval (>0h)
                if (phase === 'awaiting_approval') {
                    const ph = exp.phase_history || [];
                    const last = ph[ph.length-1];
                    const hoursWaiting = last ? (Date.now() - new Date(last.entered_at).getTime()) / 3600000 : 0;
                    items.push({
                        cls: hoursWaiting > 24 ? 'warning' : 'info',
                        icon: hoursWaiting > 24 ? '🔔' : '👀',
                        text: `<strong>Approve hypothesis on <code>${exp.experiment_id}</code></strong> · ${surface} · waiting ${hoursWaiting.toFixed(0)}h`,
                        meta: (exp.hypothesis || '').slice(0, 100) + ((exp.hypothesis || '').length > 100 ? '…' : ''),
                        cta_label: 'Reply in Slack →',
                        cta_url: slackThreadUrl(exp.slack_thread_ts),
                    });
                }

                // Tier-1 / tier-2 breach (read from latest guardrail_check)
                const checks = exp.guardrail_checks || [];
                const last = checks[checks.length-1];
                if (last && last.result && last.result.includes('breach')) {
                    const isTier1 = last.result === 'tier1_breach';
                    items.push({
                        cls: isTier1 ? 'danger' : 'warning',
                        icon: isTier1 ? '🚨' : '⚠️',
                        text: `<strong>${isTier1 ? 'TIER-1 BREACH' : 'Tier-2 advisory'} on <code>${exp.experiment_id}</code></strong> · ${last.metric} ${(last.delta_pct >= 0 ? '+' : '')}${(last.delta_pct*100).toFixed(1)}% (threshold ${(last.threshold_pct*100).toFixed(0)}%)`,
                        meta: `Action: ${last.action_taken} · snapshot ${fmtRelative(last.snapshot_at)}`,
                        cta_label: 'View thread →',
                        cta_url: slackThreadUrl(exp.slack_thread_ts),
                    });
                }

                // decided phase awaiting confirmation
                if (phase === 'decided') {
                    items.push({
                        cls: 'info',
                        icon: '✅',
                        text: `<strong>Confirm decision on <code>${exp.experiment_id}</code></strong> · ${surface}`,
                        meta: 'Bayesian analysis complete; final keep/discard awaiting confirmation.',
                        cta_label: 'Reply in Slack →',
                        cta_url: slackThreadUrl(exp.slack_thread_ts),
                    });
                }
            }

            return items;
        }

        // ─── RENDER ────────────────────────────────────────────────────────────
        function renderError() {
            const eb = document.getElementById('errorBanner');
            if (appState.error) {
                eb.innerHTML = `<div class="error">${appState.error}</div>`;
            } else {
                eb.innerHTML = '';
            }
        }

        function renderActionQueue() {
            const items = buildActionQueue();
            if (!items.length) {
                return `
                    <div class="panel compact-empty">
                        <div class="panel-header">
                            <div class="panel-title">Action Queue</div>
                            <div class="panel-meta">Nothing waiting on you · system running cleanly</div>
                        </div>
                    </div>`;
            }
            const rows = items.map(it => `
                <div class="action-row ${it.cls}">
                    <div class="action-icon">${it.icon}</div>
                    <div class="action-text">
                        ${it.text}
                        ${it.meta ? `<div class="meta">${it.meta}</div>` : ''}
                    </div>
                    ${it.cta_url ? `<a class="action-cta" href="${it.cta_url}" target="_blank">${it.cta_label}</a>` : ''}
                </div>`).join('');
            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Action Queue</div>
                        <div class="panel-meta">${items.length} item${items.length === 1 ? '' : 's'}</div>
                    </div>
                    <div class="panel-body">${rows}</div>
                </div>`;
        }

        function renderActiveExperiments() {
            const exps = appState.stateJson?.experiments || {};
            const surfaces = SURFACES_LIST;  // shows ALL configured surfaces

            const rows = surfaces.map(surface => {
                const exp = exps[surface];
                if (!exp) {

                        <tr class="surface-${surface}">

                const previewUrlVal = previewUrl(exp);

                const dataRow = `
                    <tr class="surface-row" data-surface="${surface}" onclick="toggleDetail('${surface}')">

                        <td class="num">${timeInPhase(exp)}</td>

                        <td class="num" style="color: var(--text-muted)">— GA4 pending</td>
                        <td class="num">${controlSessions.toLocaleString()} / ${variantSessions.toLocaleString()}</td>
                        <td class="num">${renderGuardrailDots(exp)}</td>
                        <td>${previewUrlVal ? `<a href="${previewUrlVal}" target="_blank" onclick="event.stopPropagation()">🔗</a>` : '—'}</td>
                        <td>${slackUrl ? `<a href="${slackUrl}" target="_blank" onclick="event.stopPropagation()">💬</a>` : '—'}</td>

                    <tr class="detail-row" id="detail-${surface}" style="display: none;">

            return `
                <div class="panel">

                        <div class="panel-title">Active Experiments</div>
                        <div class="panel-meta">${surfaces.length} surface${surfaces.length === 1 ? '' : 's'} configured · click row for detail</div>
                    </div>
                    <div class="panel-body">
                        <table class="experiments">
                            <thead>
                                <tr>
                                    <th>Surface</th>
                                    <th>Status</th>
                                    <th>Cycle</th>
                                    <th>Time</th>
                                    <th>Primary metric</th>
                                    <th>Confidence</th>
                                    <th>Sessions (c/v)</th>
                                    <th>Guardrails</th>
                                    <th>Preview</th>
                                    <th>Slack</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        function renderGuardrailDots(exp) {
            const checks = exp.guardrail_checks || [];
            const last = checks[checks.length-1];
            if (!last) return '<span style="color: var(--text-muted)">— no checks</span>';
            if (last.result === 'healthy') {
                return `<span style="color: var(--success)" title="Last check ${fmtRelative(last.checked_at)}">● healthy</span>`;
            }
            if (last.result === 'tier1_breach') {
                return `<span style="color: var(--danger)" title="${last.metric} ${(last.delta_pct*100).toFixed(1)}%">🚨 tier-1</span>`;
            }
            if (last.result === 'tier2_breach') {
                return `<span style="color: var(--warning)" title="${last.metric} ${(last.delta_pct*100).toFixed(1)}%">⚠ tier-2</span>`;
            }
            return last.result;
        }

        function renderDetail(surface, exp) {
            const surfaceCfg = appState.surfaces[surface];
            const filesChanged = exp.files_changed || [];
            const phaseHistory = (exp.phase_history || []).slice().reverse();
            const guardrailChecks = (exp.guardrail_checks || []).slice(-8).reverse();
            const metrics = exp.current_metrics;

            // ── Title row ──
            const seededBy = exp.seeded_by ? ` · seeded by ${exp.seeded_by}` : '';
            const canaryStart = exp.canary_started_at ? ` · canary since ${fmtTimeAbs(exp.canary_started_at)}` : '';
            const titleHtml = `
                <div class="detail-title-row">
                    <div>
                        <div class="detail-title">Experiment Detail<span class="id">${exp.experiment_id || surface}</span></div>
                        <div class="detail-subtitle">${exp.cycle_tag || ''}${seededBy}${canaryStart}</div>
                    </div>
                </div>`;

            // ── Performance visual (sample size + per-metric delta bars) ──
            const performanceHtml = renderPerformanceSection(exp, surfaceCfg);

            // ── Phase timeline (horizontal pills) ──
            const timelineHtml = renderPhaseTimeline(exp);

            // ── Guardrail status visual (per-metric current standing vs thresholds) ──
            const guardrailHtml = renderGuardrailVisual(metrics, surfaceCfg);

            // ── Recent guardrail checks (compact timeline) ──
            const recentChecksHtml = guardrailChecks.length ? `
                <ul class="phase-history">
                    ${guardrailChecks.map(c => {
                        const dot = c.result === 'healthy' ? '🟢' :
                                    c.result === 'tier1_breach' ? '🔴' :
                                    c.result === 'tier2_breach' ? '🟡' : '⚪';
                        const detail = c.metric
                            ? ` · ${c.metric} ${(c.delta_pct * 100).toFixed(1)}%`
                            : '';
                        return `<li>
                            <span class="ts">${fmtTimeAbs(c.checked_at)}</span>
                            <span>${dot} ${c.result}${detail}${c.action_taken && c.action_taken !== 'none' ? ` → ${c.action_taken}` : ''}</span>
                        </li>`;
                    }).join('')}
                </ul>` : `<div class="awaiting">No guardrail checks yet — first cron run after canary activation will populate.</div>`;

            // ── Phase history (chronological list, full detail) ──
            const phaseHistoryHtml = phaseHistory.length ? `
                <ul class="phase-history">
                    ${phaseHistory.map(p => `
                        <li>
                            <span class="ts">${fmtTimeAbs(p.entered_at)}</span>
                            <span>${p.phase}${p.reason ? ` — ${p.reason}` : ''}</span>
                        </li>`).join('')}
                </ul>` : '<div class="awaiting">No phase history.</div>';

            return `
                <div class="detail-wrap">
                    ${titleHtml}
                    <div class="detail-grid">
                        <div>
                            <div class="detail-section">
                                <h3>Hypothesis</h3>
                                <p>${exp.hypothesis || exp.seeded_hypothesis || '<em>No hypothesis recorded.</em>'}</p>
                            </div>
                            <div class="detail-section">
                                <h3>Performance vs Control</h3>
                                ${performanceHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Guardrail Status</h3>
                                ${guardrailHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Recent Guardrail Checks (last 8)</h3>
                                ${recentChecksHtml}
                            </div>
                        </div>
                        <div>
                            <div class="detail-section">
                                <h3>Phase Timeline</h3>
                                ${timelineHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Phase History</h3>
                                ${phaseHistoryHtml}
                            </div>
                            <div class="detail-section">
                                <h3>Files Changed</h3>
                                <ul class="files-changed">
                                    ${filesChanged.length ? filesChanged.map(f => `<li>${f}</li>`).join('') : '<li><em>None recorded</em></li>'}
                                </ul>
                            </div>
                            <div class="detail-section">
                                <h3>Branch / Preview Theme</h3>
                                <p>
                                    <code>${exp.branch || '—'}</code><br>
                                    <span style="color: var(--text-muted)">Preview theme ID:</span> <code>${exp.preview_theme_id || '—'}</code>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // ── Renders the sample-size bar + per-metric delta bars ──
        function renderPerformanceSection(exp, surfaceCfg) {
            const m = exp.current_metrics;
            if (!m || ((m.control?.sessions || 0) === 0 && (m.variant?.sessions || 0) === 0)) {
                return `<div class="awaiting">Awaiting first GA4 snapshot. Cron pulls metrics every 6h once events flow. Visualizations will appear here automatically.</div>`;
            }

            const cs = m.control?.sessions || 0;
            const vs = m.variant?.sessions || 0;
            const total = cs + vs;
            const cPct = total ? (cs / total * 100) : 50;
            const vPct = 100 - cPct;

            const sampleHtml = `
                <div class="sample-bar" title="control ${cs} · variant ${vs}">
                    <div class="control" style="width: ${cPct}%"></div>
                    <div class="variant" style="width: ${vPct}%"></div>
                </div>
                <div class="sample-legend">
                    <span class="ctl">● Control: ${cs.toLocaleString()}</span>
                    <span class="var">● Variant: ${vs.toLocaleString()}</span>
                </div>`;

            // Per-metric delta bars (atc_rate, cvr, bounce_rate)
            const tier1Rules = surfaceCfg?.guardrails?.tier_1 || [];
            const tier2Rules = surfaceCfg?.guardrails?.tier_2 || [];
            const allMetricNames = new Set([
                ...tier1Rules.map(r => r.metric),
                ...tier2Rules.map(r => r.metric),
                'atc_rate', 'bounce_rate', 'cvr',
            ]);

            const metricRows = Array.from(allMetricNames).map(metric => {
                return renderMetricDeltaBar(metric, m, tier1Rules, tier2Rules);
            }).join('');

            return `
                <div style="margin-bottom: 14px;">
                    <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px;">Sample Size</div>
                    ${sampleHtml}
                </div>
                <div>
                    <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px;">Variant vs Control Delta (per metric)</div>
                    ${metricRows}
                </div>`;
        }

        // ── A single metric delta bar with threshold markers ──
        function renderMetricDeltaBar(metric, currentMetrics, tier1Rules, tier2Rules) {
            const ctrl = currentMetrics?.control?.[metric];
            const variant = currentMetrics?.variant?.[metric];

            const t1 = tier1Rules.find(r => r.metric === metric);
            const t2 = tier2Rules.find(r => r.metric === metric);

            // Bar visualizes -25% to +25% (5% padding beyond largest tier-1 threshold of 20%)
            const RANGE = 25;
            const pctToLeft = pct => 50 + (pct / RANGE) * 50;  // -25% = 0%, 0% = 50%, +25% = 100%

            // Threshold markers
            const markers = [];
            if (t1) {
                const dropMark = t1.direction === 'drop' ? -t1.threshold_pct : null;
                const riseMark = t1.direction === 'rise' ? t1.threshold_pct : null;
                if (dropMark !== null) markers.push({ pct: dropMark, cls: 'danger' });
                if (riseMark !== null) markers.push({ pct: riseMark, cls: 'danger' });
            }
            if (t2) {
                const dropMark = t2.direction === 'drop' ? -t2.threshold_pct : null;
                const riseMark = t2.direction === 'rise' ? t2.threshold_pct : null;
                if (dropMark !== null) markers.push({ pct: dropMark, cls: 'warning' });
                if (riseMark !== null) markers.push({ pct: riseMark, cls: 'warning' });
            }
            const markerHtml = markers.map(mk => {
                const left = Math.max(0, Math.min(100, pctToLeft(mk.pct)));
                return `<div class="threshold ${mk.cls}" style="left: ${left}%" title="${mk.pct}% threshold"></div>`;
            }).join('');

            // Fill bar (variant delta vs control)
            let fillHtml = '';
            let deltaText = '—';
            let deltaCls = 'muted';
            if (ctrl !== null && ctrl !== undefined && ctrl !== 0 && variant !== null && variant !== undefined) {
                const delta = (variant - ctrl) / ctrl;
                const deltaPct = delta * 100;
                const fillCls = breachClass(deltaPct, t1, t2);
                const isNeg = deltaPct < 0;
                const left = isNeg ? pctToLeft(deltaPct) : 50;
                const width = Math.abs(deltaPct) / RANGE * 50;
                fillHtml = `<div class="fill ${fillCls}" style="left: ${Math.max(0, Math.min(100, left))}%; width: ${Math.min(50, width)}%"></div>`;
                deltaText = `${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(1)}%`;
                deltaCls = '';
            } else if ((currentMetrics?.control?.sessions || 0) > 0) {
                deltaText = '—';
                deltaCls = 'muted';
            }

            return `
                <div class="metric-row">
                    <div class="metric-label">${metric}</div>
                    <div class="metric-bar${ctrl === undefined ? ' empty' : ''}">
                        <div class="zero"></div>
                        ${markerHtml}
                        ${fillHtml}
                    </div>
                    <div class="metric-delta ${deltaCls}">${deltaText}</div>
                </div>`;
        }

        function breachClass(deltaPct, t1, t2) {
            // Determine which tier (if any) this delta breaches.
            function breaches(rule, dpct) {
                if (!rule) return false;
                const t = rule.threshold_pct;
                return rule.direction === 'drop' ? dpct <= -t : dpct >= +t;
            }
            if (breaches(t1, deltaPct)) return 'tier1';
            if (breaches(t2, deltaPct)) return 'tier2';
            return 'healthy';
        }

        // ── Phase timeline (horizontal pills with current highlighted) ──
        function renderPhaseTimeline(exp) {
            const phases = ['idle', 'awaiting_approval', 'canary', 'measuring', 'analyzing', 'decided'];
            const current = exp.phase || 'idle';
            const reachedSet = new Set((exp.phase_history || []).map(p => p.phase));
            reachedSet.add(current);

            const pills = phases.map(p => {
                const cls = (p === current) ? 'current' : (reachedSet.has(p) ? 'done' : '');
                return `<div class="phase-pill-tl ${cls}">${p.replace('_', ' ')}</div>`;
            }).join('');

            // Estimate time-in-current-phase (already computed elsewhere; quick summary here)
            const lastEntry = (exp.phase_history || []).filter(p => p.phase === current).pop();
            const enteredAt = lastEntry?.entered_at;
            const meta = enteredAt ? `In <strong>${current}</strong> since ${fmtTimeAbs(enteredAt)} · ${fmtRelative(enteredAt)}` : '';

            return `
                <div class="phase-timeline">${pills}</div>
                <div class="phase-timeline-meta">${meta}</div>`;
        }

        // ── Guardrail status visual: pills showing which tier each metric is in ──
        function renderGuardrailVisual(metrics, surfaceCfg) {
            const safetyEnabled = appState.stateJson?._safety_config?.revert_enabled;
            const stage = safetyEnabled ? 'Stage 2 — auto-revert LIVE' : 'Stage 1 — alert-only';

            if (!surfaceCfg?.guardrails) {
                return '<div class="awaiting">Surface config not yet synced.</div>';
            }
            const t1 = surfaceCfg.guardrails.tier_1 || [];
            const t2 = surfaceCfg.guardrails.tier_2 || [];

            const summary = `<p style="margin-bottom: 10px; color: var(--text-muted); font-size: 11px;">
                <strong style="color: var(--text)">${stage}</strong> · min canary sessions per arm: ${surfaceCfg.guardrails.min_canary_sessions_per_arm || 50}
            </p>`;

            const tierRow = (label, rules, color) => `
                <div style="margin-bottom: 6px;">
                    <span style="font-size: 11px; color: ${color}; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;">${label}:</span>
                    ${rules.length ? rules.map(r =>
                        `<span style="display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 3px; background: var(--bg); font-size: 11px; font-family: monospace;">${r.metric} ${r.direction === 'drop' ? '−' : '+'}${r.threshold_pct}%</span>`
                    ).join('') : '<em style="color: var(--text-muted); font-size: 11px;">none</em>'}
                </div>`;

            return summary + tierRow('Tier 1 (auto-revert)', t1, 'var(--danger)') + tierRow('Tier 2 (pause)', t2, 'var(--warning)');
        }

        function toggleDetail(surface) {
            const row = document.getElementById('detail-' + surface);
            if (!row) return;
            const visible = row.style.display !== 'none';
            row.style.display = visible ? 'none' : 'table-row';
            const dataRow = document.querySelector(`tr[data-surface="${surface}"]`);
            if (dataRow) dataRow.classList.toggle('expanded', !visible);
        }

        function renderRecentlyDecided() {
            const exps = appState.stateJson?.experiments || {};
            // No completed cycles yet — show empty state for Phase 1
            const decided = Object.values(exps).filter(e => e.phase === 'decided' || e.phase === 'idle' && (e.phase_history || []).some(p => p.phase === 'decided'));
            if (!decided.length) {
                return `
                    <div class="panel compact-empty">
                        <div class="panel-header">
                            <div class="panel-title">Recently Decided</div>
                            <div class="panel-meta">No completed cycles yet · first ETA ~May 4</div>
                        </div>
                    </div>`;
            }
            // (Detailed table will populate once Cycle 1 completes; minimal scaffold for now)
            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Recently Decided</div>
                        <div class="panel-meta">${decided.length} cycle${decided.length === 1 ? '' : 's'} · last 30 days</div>
                    </div>
                    <div class="panel-body padded">
                        <p style="font-size: 12px; color: var(--text-muted)">Detail rendering wired in once Cycle 1 ships an outcome. (Phase 1 scaffold.)</p>
                    </div>
                </div>`;
        }

        function renderPerformanceMemory() {
            const sections = SURFACES_LIST.map(surface => {
                const md = appState.performance[surface];
                if (!md) {
                    return `
                        <div class="pm-section" data-surface="${surface}">
                            <div class="pm-toggle" onclick="this.parentElement.classList.toggle('open')">
                                <span class="arrow">▶</span>
                                <span class="pm-toggle-text">${surface}</span>
                                <span class="pm-meta">no memory file</span>
                            </div>
                            <div class="pm-content"><em>Performance memory not yet synced for this surface.</em></div>
                        </div>`;
                }
                const cyclesMatch = md.match(/Total cycles[*:]+\s*(\d+)/);
                const cycles = cyclesMatch ? cyclesMatch[1] : '0';
                const liftMatch = md.match(/Cumulative lift[*:]+\s*([+\-\d.%]+)/);
                const lift = liftMatch ? liftMatch[1] : '0.0%';
                return `
                    <div class="pm-section" data-surface="${surface}">
                        <div class="pm-toggle" onclick="this.parentElement.classList.toggle('open')">
                            <span class="arrow">▶</span>
                            <span class="pm-toggle-text">${surface}</span>
                            <span class="pm-meta">${cycles} cycle${cycles === '1' ? '' : 's'} · cumulative lift ${lift}</span>
                        </div>
                        <div class="pm-content">${marked.parse(md)}</div>
                    </div>`;
            }).join('');
            return `
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Performance Memory</div>
                        <div class="panel-meta">institutional learnings · click to expand</div>
                    </div>
                    <div class="panel-body">${sections}</div>
                </div>`;
        }

        function renderSystemHealth() {
            // Stats bar at top covers active surfaces / stage / last cron / cycles —
            // keep this footer slim, just for context the stats bar can't fit.
            return `
                <div class="footnote" style="margin-top: 18px;">
                    GA4 metric integration is Phase 2 — live A/B traffic data populates
                    once the cron's GA4 query catches up (24-48h for fresh dimensions).
                    Realtime view in GA4 admin shows events immediately if you need
                    instant signal during canary.
                </div>`;
        }

        function renderStatsBar() {
            const s = appState.stateJson;
            const exps = s?.experiments || {};
            const activeCount = Object.values(exps).filter(e => e.phase && e.phase !== 'idle').length;
            const totalSurfaces = SURFACES_LIST.length;
            const stage = s?._safety_config?.revert_enabled ? '2 — Live' : '1 — Alert-Only';
            const stageGradient = !s?._safety_config?.revert_enabled;

            // Find current canary/measuring experiment for "Cycle" card
            const activeExp = Object.values(exps).find(e => e.phase === 'canary' || e.phase === 'measuring');
            const currentCycle = activeExp ? (activeExp.cycle_tag || activeExp.experiment_id) : '—';
            const currentPhase = activeExp ? activeExp.phase : 'idle';

            return `
                <div class="stats-bar">
                    <div class="stat-card">
                        <span class="stat-card-label">Stage</span>
                        <span class="stat-card-value ${stageGradient ? 'gradient' : ''}">${stage}</span>
                        <span class="stat-card-meta">${stageGradient ? 'Calibrating thresholds' : 'Auto-revert active'}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Active Surfaces</span>
                        <span class="stat-card-value">${activeCount} / ${totalSurfaces}</span>
                        <span class="stat-card-meta">${activeCount === totalSurfaces ? 'all running' : (totalSurfaces - activeCount) + ' idle'}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Current Cycle</span>
                        <span class="stat-card-value" style="font-size: 14px; font-family: 'SF Mono', Menlo, Consolas, monospace;">${currentCycle}</span>
                        <span class="stat-card-meta">${activeExp ? activeExp.surface + ' · ' + currentPhase : 'no active experiment'}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Last Cron Run</span>
                        <span class="stat-card-value" style="font-size: 14px;"><span class="pulse-dot"></span>${fmtRelative(s?._last_cron_run)}</span>
                        <span class="stat-card-meta">${fmtTimeAbs(s?._last_cron_run)}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Cycles Decided</span>
                        <span class="stat-card-value">0</span>
                        <span class="stat-card-meta">first cycle in flight</span>
                    </div>
                </div>`;
        }

        function render() {
            renderError();
            const lastRefreshEl = document.getElementById('lastRefresh');
            if (appState.loadedAt) {
                lastRefreshEl.innerHTML = `<span class="pulse-dot"></span>loaded ${fmtRelative(appState.loadedAt.toISOString())}`;
            }

            if (!appState.stateJson) {
                document.getElementById('content').innerHTML = '<div class="panel-empty">No state.json loaded. Check the error banner above.</div>';
                return;
            }

            document.getElementById('content').innerHTML = `
                ${renderStatsBar()}
                ${renderActionQueue()}
                ${renderActiveExperiments()}
                ${renderRecentlyDecided()}
                ${renderPerformanceMemory()}
                ${renderSystemHealth()}
            `;
        }

        async function refresh() {
            const btn = document.getElementById('refreshBtn');
            btn.textContent = '↻ Loading…';
            btn.disabled = true;
            await loadAll();
            render();
            btn.textContent = '↻ Refresh';
            btn.disabled = false;
        }

        document.getElementById('refreshBtn').addEventListener('click', refresh);

        // Initial load + auto-refresh every 5 minutes
        refresh();
        setInterval(refresh, 5 * 60 * 1000);
    </script>
</body>
</html>
