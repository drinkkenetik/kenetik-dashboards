name: Validate Dashboards

# 2026-07-13 (P7-T9): the ChangeSet dashboard and website-experiment dashboard
# were rebuilt in the kenetik-growth-system portal (portal/changesets.html,
# portal/experiments.html) and the two GitHub-Pages surfaces here became
# redirect stubs. The cross-repo syncs that fed them
# (sync-tracker-to-dashboards.yml, sync-website-state-to-dashboards.yml,
# sync-clarity-to-dashboards.yml) are retired in kgs.
#
# Consequently the two dashboard-coupled jobs are retired here:
#   - validate-changeset-tracker  (validated the now-unsynced data/changeset-tracker.json)
#   - validate-dashboard-stats     (the D4 gate that reproduced every statistic the
#                                   live changeset-dashboard.html displayed — moot for a stub)
# Their scripts (validate-changeset-tracker.py, validate-dashboard-stats.py) are
# deleted with this change. The synced data products (data/changeset-*.json,
# data/website-state.json, data/clarity/*, data/auto-optimize/*) are now orphaned
# in this repo — left in place, flagged to Devon (mirrors the 2026-07-13 Virtual
# Team retirement's handling of system-state.json).
#
# The surface-registry gate is KEPT. surface-registry.json is CANONICAL in kgs
# (architecture/reporting/); the mirror sync is retired, so this repo's copy is
# updated manually — see its _comment.

on:
  push:
    branches: [main]
    paths:
      - 'changeset-dashboard.html'
      - 'website-experiment-dashboard.html'
      - 'creator-hub.html'
      - 'kenetik-network-viewer.html'
      - 'surface-registry.json'
      - 'validate-surface-registry.py'
  pull_request:
    branches: [main]

jobs:
  validate-surface-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Surface registry gate (P4-T5) — every deployed HTML must be registered
        run: python3 validate-surface-registry.py --registry surface-registry.json --html *.html

      - name: Post failure summary
        if: failure()
        run: |
          echo "## ❌ Surface Registry Gate Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A root-level HTML surface is not registered in surface-registry.json with a deployable status." >> $GITHUB_STEP_SUMMARY
          echo "The registry is canonical in kgs at architecture/reporting/surface-registry.json (this repo's copy is a manual mirror — edit it there and re-copy)." >> $GITHUB_STEP_SUMMARY
