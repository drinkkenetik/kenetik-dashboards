# Surface Config: pdp-atc
# =======================
# This is the "program.md" equivalent — the instructions the optimization
# agent reads to know what it can and cannot do on the PDP surface.
#
# Lives in the theme repo at: auto-optimize/surfaces/pdp-atc.yaml
# The agent reads it at the start of each cycle.
# The Track A cron reads `guardrails.tier_1` / `tier_2` / `min_canary_sessions_per_arm` every 6h.
#
# Devon or Katie edit this file to control the optimizer's behavior.

# ─── CONFIG HISTORY ───────────────────────────────────────────────────────────
# v1.0 (2026-04-03) — Initial config. Referenced generic Shopify PDP files
#   (sections/main-product.liquid, snippets/product-info.liquid, etc.) that
#   are NOT rendered on the live Kenetik PDP. Changes to those files would
#   have had zero runtime effect.
# v2.0 (2026-04-24) — Rewritten by Katie after analyzing templates/product.cw-product.json
#   to map fair-game files + elements to the ACTUAL live render path:
#   cw-01-product-banner + supporting cw-hp-* and KS-* sections.
#   The `main` (generic Shopify product) section is DISABLED in cw-product.json.
#   See `disabled_in_live_template` section below for sections present in the
#   template but marked disabled — changes to those will not appear on the PDP.
# v3.0 (2026-04-27) — Track A migration:
#   • Moved from KGS repo (`config/surface-configs/pdp-atc-theme.yaml`) to theme
#     repo (`auto-optimize/surfaces/pdp-atc.yaml`) so the cron can read guardrails
#     locally without cross-repo checkout.
#   • Migrated `guardrails.tier_1_emergency_revert` and `tier_2_pause_notify`
#     to machine-parseable list-of-rules under `tier_1` and `tier_2`.
#   • Renamed `primary_metric: add_to_cart_rate` → `atc_rate` to match the
#     metric key used in tier_1/tier_2 rules (one canonical name).
#   • Added `min_canary_sessions_per_arm: 50` for canary→measuring promotion gate.
#
# Primary source of truth for what renders:
#   drinkkenetik/kenetik-shopify-theme → templates/product.cw-product.json
#   (order[] array + per-section "disabled": true/false)

surface_id: pdp-atc
surface_name: "Product Detail Page — Add to Cart Rate"
primary_metric: atc_rate
primary_metric_direction: higher_is_better

# ── Template Binding ──
# The surface config is bound to a specific template. All file/element references
# below assume this template is the one the variant will deploy against.
template_file: templates/product.cw-product.json
template_note: >
  Template JSON is auto-generated by Shopify admin theme editor. Editing it
  directly on `main` risks being overwritten by admin saves. On the variant
  branch (which deploys only to a preview theme) it is safe to edit.
  Prefer mutating the underlying Liquid sections over mutating section settings
  in the template JSON where possible — it's more durable.

# ── URL membership (for Clarity-aware hypothesis generation) ──
# The auto-optimize-orchestrator reads this list during the `decided` phase
# to filter the Clarity friction snapshot to only this surface's URLs. Top
# friction signals on these specific pages then inform the next hypothesis
# (e.g., if rage clicks concentrate on the buy button, the next experiment
# can target that element specifically rather than picking a generic
# next-element from the fair-game list).
#
# Format: full canonical URLs (matches the canonicalize_url output in
# scripts/track_clarity_cron.py — scheme + host + path, no query string).
# The Clarity snapshot's `urls` map keys are in this same format.
#
# Add or remove URLs as the product catalog evolves. Empty list (or missing
# field) means "all PDP traffic" — orchestrator falls back to top friction
# across the whole site.
urls:
  - https://drinkkenetik.com/products/kenetik-cans-daily-clarity-focus
  - https://drinkkenetik.com/products/kenetik-shots-on-the-go-clarity-focus
  - https://drinkkenetik.com/products/kenetik-concentrate-customizable-clarity-focus

# ── Measurement ──
measurement_window_days: 7
minimum_sample_size: 100    # sessions per variant (Bayesian needs less than frequentist)
traffic_split: "50/50"
canary_ramp_hours: 24       # time-based canary per current cron.yml (no in-window metric gate)

# ── Files the agent CAN modify ──────────────────────────────────────────────
# Only these files are fair game for experiment variants. Grouped by what
# they render on the live cw-product PDP. Generic Shopify product files
# (sections/main-product.liquid, snippets/product-info.liquid, etc.) are
# INTENTIONALLY EXCLUDED because the template disables the `main` section.
fair_game_files:
  # — Buy box / hero (the ATC-critical section) —
  - sections/cw-01-product-banner.liquid           # 721 LOC; star rating, variant selector, purchase-type radio, ATC button, accordions, badges
  - assets/cw-subscription.css                     # purchase-type styling (referenced by cw-01 line 3)

  # — Top announcement bar —
  - sections/KS-new-uspa-slider.liquid             # 93 LOC; 5-slide USP ticker

  # — Reviews (two independent modules; both render on cw-product) —
  - sections/cw-hp-02-customer-review-slider.liquid   # 148 LOC; 5 curated reviewer quotes
  - sections/cw-customer-saying.liquid                # 68 LOC; Klaviyo reviews widget + headline + rating summary

  # — Benefit / comparison storytelling (below fold) —
  - sections/cw-hp-08-clean-energy.liquid          # 104 LOC; Start Stronger / Think Sharper / Recover Faster triptych
  - sections/cw-hp-13-ketones-difference.liquid    # 253 LOC; Kenetik vs Caffeine vs Sugar comparison table

  # — Subscription value-prop and FAQ —
  - sections/cw-get-kenetik-delivered.liquid       # 99 LOC; Save 15% / Cancel anytime / Free shipping tiles
  - sections/cw-faq.liquid                         # 68 LOC; 9 Q&A entries (claims-sensitive)

  # — Secondary USP + newsletter —
  - sections/cw-uspa.liquid                        # 72 LOC; icon row (appears near footer in cw-product)
  - sections/cw-hp-17-newsletter.liquid            # newsletter signup

  # — Affiliate / partner surfaces (out of scope for pdp-atc) —
  - sections/KS-partner-sticky-bar.liquid  # partner sticky bar (KS-partner-sticky-bar)

  # — Template-level section ordering (preview branch only) —
  - templates/product.cw-product.json              # order[] + per-section disabled:true/false; edits survive on preview themes


# ── Elements within those files that are fair game ──────────────────────────
# Grouped by section for readability. Each element maps to a specific region
# of the corresponding Liquid file.
fair_game_elements:

  # — cw-01-product-banner.liquid (buy box) —
  - purchase_type_default_selection      # which radio (one-time vs subscribe-save) has `checked` — lines ~269-297
  - purchase_type_ordering               # DOM order of the two .wn-product__purchase-options divs
  - purchase_type_labels                 # "One-time purchase" / "Subscribe & Save 20%" copy
  - purchase_type_heading                # "Purchase Type" h3 (line ~263)
  - star_rating_display                  # star count + review_line (section settings)
  - info_accordion_content               # "How to Use It" accordion copy (section settings)
  - variant_badges                       # second_var_badge / third_var_badge / preorder_var_badge
  - atc_button_styling                   # add_to_cart_bg / add_to_cart_hover_bg / add_to_cart_text gradients
  - atc_button_text                      # CTA copy
  - buy_box_block_ordering               # reorder child elements within cw-01 section

  # — KS-new-uspa-slider.liquid (top USP ticker) —
  - uspa_slide_text                      # 5 slide messages (12g Real Ketones, Caffeine-Free, Sugar-Free, Backed by 4 Patents, 30-Day MBG)
  - uspa_slide_count                     # show fewer/more slides

  # — cw-hp-02-customer-review-slider.liquid (curated reviews) —
  - curated_review_ordering              # which of the 5 curated review blocks appear first
  - curated_review_content               # review_title (quote), reviewer_name, review_description

  # — cw-customer-saying.liquid (Klaviyo reviews summary) —
  - reviews_headline                     # "What the Kenetik Community Says"
  - reviews_summary_line                 # "4.4 | Based on 153 Happy Customer Reviews"
  - reviews_star_rating                  # star_rating setting

  # — cw-hp-08-clean-energy.liquid (benefit triptych) —
  - benefit_block_headings               # Start Stronger / Think Sharper / Recover Faster
  - benefit_block_subheadings            # one-liner under each
  - benefit_block_ordering               # left/right order of the three blocks
  - triptych_heading                     # "Fuel Your Day with Kenetik"

  # — cw-hp-13-ketones-difference.liquid (comparison table) —
  - comparison_row_content               # each comparison_sentence (e.g. "Boosts energy")
  - comparison_row_ordering              # order of the 7 comparison rows
  - comparison_cta_text                  # "Upgrade to Functional Energy" (links to #product-section)
  - comparison_heading                   # "How Kenetik Compares"
  - comparison_subheading

  # — cw-get-kenetik-delivered.liquid (subscription value-prop) —
  - subscription_value_prop_tiles        # 3 tiles (Save 15% / Cancel anytime / Free shipping)
  - subscription_heading                 # "Get Kenetik delivered directly to your door"
  - subscription_subheading              # "Subscribe to get a continual supply..."

  # — cw-faq.liquid (FAQ — claims-sensitive) —
  - faq_ordering                         # order of 9 Q&A entries
  - faq_inclusion                        # which FAQs to show/hide on variant
  - faq_content                          # Q + A copy (MUST pass claims-check before variant commit)

  # — cw-uspa.liquid (icon row — enabled instance only, UbE69h) —
  - uspa_icon_row_content                # 5 slide text + image pairings

  # — templates/product.cw-product.json (section ordering) —
  - section_ordering_above_fold          # reorder entries in order[] array (preview branch only)
  - section_enable_disable               # toggle disabled:true/false on individual sections

