# ── Guardrails ──────────────────────────────────────────────────────────────
# Schema (v3.0): tier_1 and tier_2 are machine-parseable rule lists, evaluated
# by the Track A cron every 6h against the current_metrics snapshot. Each rule
# specifies a metric (key into current_metrics.control / current_metrics.variant),
# a direction (drop or rise — what's bad), and a threshold percentage.
#
# Cron iterates tier_1 first; first breach short-circuits and triggers the
# tier action (auto-revert in Stage 2, alert-only in Stage 1). Tier_2 only
# evaluates if tier_1 was clean.
#
# Thresholds are applied to per-snapshot deltas (variant vs control); the
# cron handles the math. Stage 1 (alert_only) ships with these values; Stage 2
# calibration after pdp-atc-001 cycle 1 may tune them.
guardrails:
  tier_1:  # action: auto-revert (Stage 2) / alert-only (Stage 1)
    - { metric: atc_rate, direction: drop, threshold_pct: 20 }
    - { metric: cvr, direction: drop, threshold_pct: 20 }
    - { metric: bounce_rate, direction: rise, threshold_pct: 20 }

  tier_2:  # action: pause-for-review (Stage 2) / alert-only (Stage 1)
    - { metric: atc_rate, direction: drop, threshold_pct: 10 }
    - { metric: bounce_rate, direction: rise, threshold_pct: 10 }

  tier_3_celebrate:
    cumulative_lift_threshold_pct: 15  # Total accumulated lift → notify team

  # Cross-cycle counter — separate gate, handled outside the per-snapshot tier_1/tier_2 eval.
  consecutive_discard_limit: 3  # 3 discards in a row → pause for review

  # Promotion gate — canary→measuring transition requires at least this many
  # sessions in the variant arm (in addition to the 24h elapsed time gate).
  min_canary_sessions_per_arm: 50

# ── Compliance ──────────────────────────────────────────────────────────────
compliance:
  claims_check: required           # Every hypothesis with copy changes (FAQ + accordion copy especially)
  brand_voice_check: required      # Every hypothesis
  mobile_responsiveness: required  # Every deployment

